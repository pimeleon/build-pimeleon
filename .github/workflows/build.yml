name: Build Pimeleon Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly build on Sunday at 2 AM
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug mode'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint shellcheck-py

      - name: Lint YAML files
        run: yamllint -c .yamllint .
        continue-on-error: true

      - name: Lint Ansible playbooks
        run: ansible-lint shared/ansible/playbooks/*.yml
        continue-on-error: true

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -type f -exec shellcheck {} \;
        continue-on-error: true

  build:
    name: Build Pimeleon Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder container
        uses: docker/build-push-action@v5
        with:
          context: ./shared/containers/builder
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Pimeleon image
        run: |
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace:ro \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/cache:/cache \
            -v ${{ github.workspace }}/configs:/configs \
            -v ${{ github.workspace }}/shared/ansible:/ansible:ro \
            -v ${{ github.workspace }}/shared/scripts:/scripts:ro \
            -e WORKSPACE_DIR=/workspace \
            -e CACHE_DIR=/cache \
            -e OUTPUT_DIR=/output \
            -e TARGET_PLATFORM=rpi3-bookworm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/builder:latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output/*.tar.gz
          retention-days: 30

  test:
    name: Test Pimeleon Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output

      - name: Extract image
        run: |
          cd output
          tar -xzf pimeleon-*.tar.gz
          mv pimeleon-*/*.img.xz .

      - name: Build test container
        uses: docker/build-push-action@v5
        with:
          context: ./shared/containers/tester
          load: true
          tags: pimeleon-tester:latest

      - name: Run smoke tests
        run: |
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}/output:/images:ro \
            -v ${{ github.workspace }}/tests:/tests \
            -e TEST_SUITE=smoke \
            pimeleon-tester:latest
        timeout-minutes: 15

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: tests/results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: output/*.tar.gz
          body: |
            Pimeleon Image Release

            ## Changes
            - Built from commit: ${{ github.sha }}
            - Build date: ${{ github.event.head_commit.timestamp }}

            ## Installation
            1. Download the release archive
            2. Extract and verify checksums
            3. Write to SD card using dd or Etcher

            See README for detailed instructions.
