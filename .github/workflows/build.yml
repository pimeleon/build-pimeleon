---
name: Build Pimeleon Image

on:
  repository_dispatch:
    types: [gitlab_release, deploy-r2]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Platform to build (e.g., rpi3-bookworm)'
        required: true
        default: 'rpi3-bookworm'
      force_rebuild:
        description: 'Force a full rebuild'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint shellcheck-py

      - name: Lint YAML files
        run: yamllint -c .yamllint .
        continue-on-error: true

      - name: Lint Ansible playbooks
        run: ansible-lint shared/ansible/playbooks/*.yml
        continue-on-error: true

      - name: Lint shell scripts
        run: |
          find . -name "*.sh" -type f -exec shellcheck {} \;
        continue-on-error: true

  build:
    name: Build Pimeleon Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder container
        uses: docker/build-push-action@v5
        with:
          context: ./shared/containers/builder
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Pimeleon image
        run: |
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}:/workspace:ro \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/cache:/cache \
            -v ${{ github.workspace }}/configs:/configs \
            -v ${{ github.workspace }}/shared/ansible:/ansible:ro \
            -v ${{ github.workspace }}/shared/scripts:/scripts:ro \
            -e WORKSPACE_DIR=/workspace \
            -e CACHE_DIR=/cache \
            -e OUTPUT_DIR=/output \
            -e TARGET_PLATFORM=rpi3-bookworm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/builder:latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output/*.tar.gz
          retention-days: 30

  test:
    name: Test Pimeleon Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output

      - name: Extract image
        run: |
          echo "Pimeleon release for ${{ steps.meta.outputs.target_platform }}" > release_notes.md
          echo "Version: ${{ steps.meta.outputs.version }}" >> release_notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.needs_rebuild == 'true' || github.event.inputs.force_rebuild == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.target_platform }}-v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: |
            output/*.img.xz
            output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Cloudflare R2
        if: steps.meta.outputs.needs_rebuild == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          PLATFORM="${{ steps.params.outputs.platform }}"
          VERSION="${{ steps.params.outputs.version }}"
          UPLOAD_PREFIX="${PLATFORM}/v${VERSION}"

          echo "Deploying to R2: s3://${R2_BUCKET}/${UPLOAD_PREFIX}/"

          cd output
          tar -xzf pimeleon-*.tar.gz
          mv pimeleon-*/*.img.xz .

      - name: Build test container
        uses: docker/build-push-action@v5
        with:
          context: ./shared/containers/tester
          load: true
          tags: pimeleon-tester:latest

      - name: Run smoke tests
        run: |
          docker run --rm \
            --privileged \
            -v ${{ github.workspace }}/output:/images:ro \
            -v ${{ github.workspace }}/tests:/tests \
            -e TEST_SUITE=smoke \
            pimeleon-tester:latest
        timeout-minutes: 15

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: tests/results/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: pimeleon-image-${{ github.run_number }}
          path: output

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: output/*.tar.gz
          body: |
            Pimeleon Image Release

            ## Changes
            - Built from commit: ${{ github.sha }}
            - Build date: ${{ github.event.head_commit.timestamp }}

            ## Installation
            1. Download the release archive
            2. Extract and verify checksums
            3. Write to SD card using dd or Etcher

            See README for detailed instructions.
