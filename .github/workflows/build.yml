---
name: Pimeleon Production Build

on:
  repository_dispatch:
    types: [gitlab_release]
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Platform to build (e.g., rpi3-bookworm)'
        required: true
        default: 'rpi3-bookworm'
      force_rebuild:
        description: 'Force a full rebuild'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x .github/scripts/*.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Platform and Version
        id: meta
        env:
          INPUT_PLATFORM: ${{ github.event.client_payload.platform || github.event.inputs.target_platform || 'rpi3-bookworm' }}
          REGISTRY: ${{ env.REGISTRY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-meta.sh

      - name: Ensure adblock2privoxy image exists
        env:
          AB2P_IMAGE: ${{ steps.meta.outputs.ab2p_image }}
        run: bash .github/scripts/check-ab2p-image.sh

      - name: Check for Existing Builder
        id: check_builder
        env:
          BUILDER_IMAGE: ${{ steps.meta.outputs.builder_image }}
        run: bash .github/scripts/check-builder-image.sh

      - name: Build and Push Builder (if missing or forced)
        if: steps.check_builder.outputs.exists == 'false' || github.event.inputs.force_rebuild == 'true'
        env:
          BUILDER_IMAGE: ${{ steps.meta.outputs.builder_image }}
          AB2P_IMAGE: ${{ steps.meta.outputs.ab2p_image }}
        run: bash .github/scripts/build-push-builder.sh

      - name: Build Pimeleon Image
        if: steps.meta.outputs.needs_rebuild == 'true' || github.event.inputs.force_rebuild == 'true'
        env:
          BUILDER_IMAGE: ${{ steps.meta.outputs.builder_image }}
          TARGET_PLATFORM: ${{ steps.meta.outputs.target_platform }}
          VERSION: ${{ steps.meta.outputs.version }}
          PIMELEON_APPS_GITHUB_TOKEN: ${{ secrets.PIMELEON_APPS_GITHUB_TOKEN }}
        run: bash .github/scripts/build-pimeleon-image.sh

      - name: Generate Release Notes
        if: steps.meta.outputs.needs_rebuild == 'true' || github.event.inputs.force_rebuild == 'true'
        env:
          TARGET_PLATFORM: ${{ steps.meta.outputs.target_platform }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash .github/scripts/generate-release-notes.sh

      - name: Create GitHub Release
        if: steps.meta.outputs.needs_rebuild == 'true' || github.event.inputs.force_rebuild == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.target_platform }}-v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: |
            output/*.img.xz
            output/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
