---
name: Build & Deploy Pimeleon

on:
  # Triggered by GitLab CI after release:github creates a GitHub Release
  repository_dispatch:
    types: [deploy-r2]

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g., v0.2.0)'
        required: true
      platform:
        description: 'Target platform (e.g., rpi3-bookworm)'
        required: true
        default: 'rpi3-bookworm'

env:
  R2_BUCKET: pimeleon-releases
  R2_ENDPOINT: https://c0b0b6cd77526e2a2cb8771348e551a4.r2.cloudflarestorage.com

jobs:
  deploy-r2:
    name: Deploy to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Resolve inputs
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
            echo "platform=${{ github.event.client_payload.platform }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "platform=${{ inputs.platform }}" >> "$GITHUB_OUTPUT"
            # Strip leading 'v' from tag for version
            echo "version=$(echo '${{ inputs.tag }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.params.outputs.tag }}"
          echo "Downloading assets from release ${TAG}..."
          mkdir -p output
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "pimeleon-*.img.xz" \
            --pattern "pimeleon-*.img.metadata.json" \
            --dir output || true

          echo "Downloaded files:"
          ls -lh output/

          if [ -z "$(ls -A output/pimeleon-*.img.xz 2>/dev/null)" ]; then
            echo "::error::No image artifacts found in release ${TAG}"
            exit 1
          fi

      - name: Configure AWS CLI for R2
        run: |
          aws configure set default.s3.request_checksum_calculation when_required
          aws configure set default.s3.response_checksum_validation when_required

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          PLATFORM="${{ steps.params.outputs.platform }}"
          VERSION="${{ steps.params.outputs.version }}"
          UPLOAD_PREFIX="${PLATFORM}/v${VERSION}"

          echo "Deploying to R2: s3://${R2_BUCKET}/${UPLOAD_PREFIX}/"

          cd output
          for file in pimeleon-*.img.xz pimeleon-*.img.metadata.json; do
            [ -f "$file" ] || continue
            echo "Uploading $file..."
            aws s3 cp "$file" \
              "s3://${R2_BUCKET}/${UPLOAD_PREFIX}/$(basename "$file")" \
              --endpoint-url "${R2_ENDPOINT}" \
              --no-progress
          done

          echo "R2 deployment complete."

      - name: Verify upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          PLATFORM="${{ steps.params.outputs.platform }}"
          VERSION="${{ steps.params.outputs.version }}"
          UPLOAD_PREFIX="${PLATFORM}/v${VERSION}"

          echo "Verifying files in s3://${R2_BUCKET}/${UPLOAD_PREFIX}/..."
          aws s3 ls "s3://${R2_BUCKET}/${UPLOAD_PREFIX}/" \
            --endpoint-url "${R2_ENDPOINT}"
