title = "Pimeleon Gitleaks configuration"

[extend]
# Extend the default gitleaks config
useDefault = true

# No disabled rules - strict detection, add exceptions as needed

# Allow certain paths (based on .gitignore)
[allowlist]
description = "Global allowlist"
paths = [
  # Example files
  '''\.env\.example$''',
  # Test and documentation
  '''tests/''',
  '''docs/''',
  # Build artifacts
  '''output/''',
  '''cache/''',
  '''site/''',
  '''benchmarks/''',
  # Virtual environments
  '''\.venv/''',
  '''venv/''',
  '''node_modules/''',
  # IDE settings
  '''\.vscode/''',
  '''\.idea/''',
  # Test artifacts
  '''coverage/''',
  '''test-results/''',
  # Log files
  '''\.log$''',
  # Local config with intentional tokens
  '''CLAUDE\.md$''',
]
