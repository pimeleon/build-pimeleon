---
# Base setup tasks for Pi Router
- name: Set system hostname
  ansible.builtin.hostname:
    name: pimeleon

- name: Update hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: '127.0.1.1 pimeleon'

- name: Configure timezone
  community.general.timezone:
    name: Etc/UTC

- name: Enable essential services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - ssh
    - systemd-networkd
    - systemd-resolved
  failed_when: false

- name: Enable network services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - isc-dhcp-server
    - hostapd
    - nftables
  failed_when: false

- name: Disable conflicting services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - dhcpcd
    - networking
    - wpa_supplicant
  failed_when: false

- name: Configure sysctl for routing
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: 'net.ipv4.ip_forward', value: '1' }
    - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }

- name: Create necessary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/pimeleon
    - /var/log/pimeleon
    - /var/lib/pimeleon

- name: Install base packages
  ansible.builtin.apt:
    name:
      - vim-tiny
      - htop
      - iotop
      - tcpdump
      - mtr-tiny
      - dnsutils
      - iputils-ping
      - traceroute
    state: present
    update_cache: true
  when: ansible_connection != "chroot"

- name: Install essential network services
  ansible.builtin.apt:
    name:
      - isc-dhcp-server
      - hostapd
      - nftables
      - systemd-resolved
      - bridge-utils
      - wireless-tools
      - ifenslave
    state: present
    update_cache: true
  when: ansible_connection != "chroot"

- name: Configure systemd-networkd bond0 device
  ansible.builtin.copy:
    dest: /etc/systemd/network/bond0.netdev
    content: |
      [NetDev]
      Name=bond0
      Kind=bond

      [Bond]
      Mode=active-backup
      PrimaryReselectPolicy=always
    mode: '0644'

- name: Configure bond0 network (WAN)
  ansible.builtin.copy:
    dest: /etc/systemd/network/bond0.network
    content: |
      [Match]
      Name=bond0

      [Network]
      DHCP=yes
      IPForward=yes
    mode: '0644'

- name: Configure LAN interface (eth1)
  ansible.builtin.copy:
    dest: /etc/systemd/network/eth1.network
    content: |
      [Match]
      Name=eth1

      [Network]
      Address=192.168.76.1/24
      IPForward=yes
    mode: '0644'

- name: Configure WiFi AP interface (wlan0)
  ansible.builtin.copy:
    dest: /etc/systemd/network/wlan0.network
    content: |
      [Match]
      Name=wlan0

      [Network]
      Address=192.168.77.1/24
      IPForward=yes
    mode: '0644'

- name: Configure DHCP server
  ansible.builtin.copy:
    dest: /etc/dhcp/dhcpd.conf
    content: |
      # Basic DHCP configuration for Pi Router
      option domain-name "lan";
      option domain-name-servers 192.168.76.1, 192.168.77.1;

      default-lease-time 600;
      max-lease-time 7200;

      ddns-update-style none;
      authoritative;

      # LAN subnet (eth1)
      subnet 192.168.76.0 netmask 255.255.255.0 {
        range 192.168.76.100 192.168.76.200;
        option routers 192.168.76.1;
        option domain-name-servers 192.168.76.1;
        option broadcast-address 192.168.76.255;
      }

      # WiFi subnet (wlan0)
      subnet 192.168.77.0 netmask 255.255.255.0 {
        range 192.168.77.100 192.168.77.200;
        option routers 192.168.77.1;
        option domain-name-servers 192.168.77.1;
        option broadcast-address 192.168.77.255;
      }
    mode: '0644'
    backup: true

- name: Configure DHCP server interface
  ansible.builtin.copy:
    dest: /etc/default/isc-dhcp-server
    content: |
      # Interfaces to serve DHCP requests on
      INTERFACESv4="eth1 wlan0"
      INTERFACESv6=""
    mode: '0644'

- name: Configure WiFi Access Point
  ansible.builtin.copy:
    dest: /etc/hostapd/hostapd.conf
    content: |
      # Basic hostapd configuration for Pi Router
      interface=wlan0
      driver=nl80211

      # Basic AP settings
      ssid=pimeleon
      hw_mode=g
      channel=6
      country_code=US
      ieee80211d=1
      ieee80211n=1

      # Security settings
      wpa=2
      wpa_key_mgmt=WPA-PSK
      wpa_passphrase=changeme123
      rsn_pairwise=CCMP

      # Performance optimizations for Pi 3B+
      ht_capab=[HT40+][HT40-][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1]
      wmm_enabled=1
      max_num_sta=10
    mode: '0644'
    backup: true

- name: Configure hostapd daemon
  ansible.builtin.copy:
    dest: /etc/default/hostapd
    content: |
      DAEMON_CONF="/etc/hostapd/hostapd.conf"
      DAEMON_OPTS=""
    mode: '0644'

- name: Configure basic nftables firewall
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    content: |
      #!/usr/sbin/nft -f

      flush ruleset

      table inet pimeleon {
        chain input {
          type filter hook input priority filter; policy drop;

          # Allow established and related connections
          ct state established,related accept
          ct state invalid drop

          # Allow loopback
          iif "lo" accept

          # Allow LAN interfaces
          iifname "eth1" accept
          iifname "wlan0" accept

          # Allow WAN management (SSH)
          iifname "bond0" tcp dport 22 accept

          # Drop everything else from WAN
          iifname "bond0" drop
        }

        chain forward {
          type filter hook forward priority filter; policy drop;

          # Allow established and related
          ct state established,related accept
          ct state invalid drop

          # Allow LAN to WAN forwarding
          iifname {"eth1", "wlan0"} oifname "bond0" accept

          # Allow inter-LAN communication
          iifname "eth1" oifname "wlan0" accept
          iifname "wlan0" oifname "eth1" accept
        }

        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;

          # NAT for internet access
          oifname "bond0" masquerade
        }
      }
    mode: '0755'
    backup: true
