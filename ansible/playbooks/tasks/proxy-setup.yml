---
# Proxy Setup Task
# Configures Privoxy, Squid, and Tor (based on profile)

# Privoxy - Privacy enhancing proxy
- name: Install Privoxy
  ansible.builtin.apt:
    name: privoxy
    state: present
  when: services_enabled.privoxy | default(true)

- name: Configure Privoxy
  ansible.builtin.template:
    src: privoxy/config.j2
    dest: /etc/privoxy/config
    mode: '0644'
  when: services_enabled.privoxy | default(true)
  notify: restart privoxy

- name: Enable Privoxy service
  ansible.builtin.systemd:
    name: privoxy
    enabled: true
    state: started
  when: services_enabled.privoxy | default(true)

# Squid - Caching proxy (development only)
- name: Install Squid
  ansible.builtin.apt:
    name: squid
    state: present
  when: services_enabled.squid | default(false)

- name: Configure Squid
  ansible.builtin.template:
    src: squid/squid.conf.j2
    dest: /etc/squid/squid.conf
    mode: '0644'
  when: services_enabled.squid | default(false)
  notify: restart squid

- name: Create Squid cache directory
  ansible.builtin.file:
    path: /var/spool/squid
    state: directory
    owner: proxy
    ansible.builtin.group: proxy
    mode: '0755'
  when: services_enabled.squid | default(false)

- name: Enable Squid service
  ansible.builtin.systemd:
    name: squid
    enabled: true
    state: started
  when: services_enabled.squid | default(false)

# Tor - Anonymizing network (development only)
- name: Install Tor
  ansible.builtin.apt:
    name: tor
    state: present
  when: services_enabled.tor | default(false)

- name: Configure Tor
  ansible.builtin.template:
    src: tor/torrc.j2
    dest: /etc/tor/torrc
    mode: '0644'
  when: services_enabled.tor | default(false)
  notify: restart tor

- name: Enable Tor service
  ansible.builtin.systemd:
    name: tor
    enabled: true
    state: started
  when: services_enabled.tor | default(false)

# Disable services not in profile
- name: Disable Squid if not enabled
  ansible.builtin.systemd:
    name: squid
    enabled: false
    state: stopped
  when: not (services_enabled.squid | default(false))
  failed_when: false

- name: Disable Tor if not enabled
  ansible.builtin.systemd:
    name: tor
    enabled: false
    state: stopped
  when: not (services_enabled.tor | default(false))
  failed_when: false
