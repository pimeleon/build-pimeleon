---
# File Sharing Setup Task
# Configures Samba and NFS (development profile only)

# Samba - SMB/CIFS file sharing
- name: Install Samba
  apt:
    name:
      - samba
      - samba-common-bin
    state: present
  when: services_enabled.samba | default(false)

- name: Configure Samba
  template:
    src: samba/smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: '0644'
  when: services_enabled.samba | default(false)
  notify: restart smbd

- name: Create Samba share directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: pi
    group: pi
    mode: '0755'
  loop: "{{ samba.shares | default([]) }}"
  when:
    - services_enabled.samba | default(false)
    - samba.shares is defined

- name: Set Samba password for pi user
  shell: |
    (echo "{{ pimeleon_initial_password }}"; echo "{{ pimeleon_initial_password }}") | smbpasswd -a pi -s
  args:
    creates: /var/lib/samba/private/passdb.tdb
  when: services_enabled.samba | default(false)
  no_log: true

- name: Enable Samba services
  systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - smbd
    - nmbd
  when: services_enabled.samba | default(false)

# NFS - Network File System
- name: Install NFS server
  apt:
    name: nfs-kernel-server
    state: present
  when: services_enabled.nfs | default(false)

- name: Configure NFS exports
  template:
    src: nfs/exports.j2
    dest: /etc/exports
    mode: '0644'
  when: services_enabled.nfs | default(false)
  notify: reload nfs-exports

- name: Create NFS export directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: pi
    group: pi
    mode: '0755'
  loop: "{{ nfs.exports | default([]) }}"
  when:
    - services_enabled.nfs | default(false)
    - nfs.exports is defined

- name: Enable NFS server
  systemd:
    name: nfs-kernel-server
    enabled: yes
    state: started
  when: services_enabled.nfs | default(false)

# Disable services if not in profile
- name: Disable Samba if not enabled
  systemd:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - smbd
    - nmbd
  when: not (services_enabled.samba | default(false))
  ignore_errors: yes

- name: Disable NFS if not enabled
  systemd:
    name: nfs-kernel-server
    enabled: no
    state: stopped
  when: not (services_enabled.nfs | default(false))
  ignore_errors: yes
