---
# Main playbook for Pimeleon configuration
- name: Pimeleon Complete Setup
  hosts: pimeleon

  pre_tasks:
    - name: Display build information
      ansible.builtin.debug:
        msg: "Building Pimeleon image for {{ ansible_hostname }}"

  tasks:
    - name: Run base setup
      ansible.builtin.include_tasks: tasks/base-setup.yml
      tags: [base]

    - name: Run network setup
      ansible.builtin.include_tasks: tasks/network-setup.yml
      tags: [network]

    - name: Run security hardening
      ansible.builtin.include_tasks: tasks/security-hardening.yml
      tags: [security]

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: "Pimeleon configuration completed successfully!"

  handlers:
    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
