---
# Raspberry Pi 3 Model B+ specific configuration

platform_model: "3B+"
display_name: "Raspberry Pi 3 Model B+"

# Hardware specs
architecture: "armhf"
soc: "BCM2710"
cpu_cores: 4
cpu_freq_default: 1200
cpu_freq_max: 1400
ram_mb: 1024

# Device tree
device_tree: "bcm2710-rpi-3-b-plus.dtb"
device_tree_overlays:
  - "pi3-disable-bt.dtbo"

# Network performance (USB 2.0 limited)
ethernet_available: true
ethernet_max_speed_mbps: 300
wifi_max_speed_mbps: 100

# config.txt parameters
config_txt:
  enable_uart: 1
  dtparam_spi: "on"
  dtparam_i2c: "on"
  gpu_mem: 16
  arm_freq: 1200
  over_voltage: 2
  max_usb_current: 1

# hostapd WiFi capabilities
hostapd_ht_capab: "[HT40+][HT40-][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1]"
hostapd_vht_enabled: false
hostapd_max_sta: 10
