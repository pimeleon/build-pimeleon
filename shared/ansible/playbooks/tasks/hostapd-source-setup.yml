---
# hostapd installation from APT
# Bookworm includes hostapd 2.10 with WPA3/SAE support

- name: Install hostapd from APT
  ansible.builtin.apt:
    name: hostapd
    state: present
    update_cache: false
  when: services_enabled.hostapd | default(true)

- name: Create hostapd compatibility symlink for APT install
  ansible.builtin.file:
    src: /usr/sbin/hostapd
    dest: /usr/local/bin/hostapd
    state: link
  when:
    - services_enabled.hostapd | default(true)
    - not (build_from_source | default({})).hostapd | default(false)

- name: Create hostapd config directory
  ansible.builtin.file:
    path: /etc/hostapd
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: services_enabled.hostapd | default(true)

- name: Create hostapd systemd service
  ansible.builtin.template:
    src: hostapd/hostapd.service.j2
    dest: /etc/systemd/system/hostapd.service
    mode: '0644'
  when: services_enabled.hostapd | default(true)
  notify:
    - Reload systemd
    - Restart hostapd
