# DDNS configuration for BIND9 integration
# Copy RNDC key to DHCP directory for DDNS integration
- name: Copy RNDC key for DHCP-DNS integration
  ansible.builtin.copy:
    src: /etc/bind/rndc.key
    dest: /etc/dhcp/rndc.key
    remote_src: true
    mode: '0640'
    owner: root
    group: root
  when:
    - services_enabled.dhcp_server | default(true)
    - services_enabled.dns_server | default(true)
  notify:
    - Restart isc-dhcp-server
    - Restart bind9
