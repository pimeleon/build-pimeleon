---
# Base setup tasks for Pimeleon
# Note: APT keyring migration is handled in stage2-customize.sh before Ansible runs

# Boot configuration (GPU memory, CPU freq, overlays)
- name: Deploy Raspberry Pi boot config
  ansible.builtin.template:
    src: boot/config.txt.j2
    dest: /boot/config.txt
    mode: '0755'
  when: config_txt is defined

- name: Remove deprecated elevator= kernel parameter from cmdline.txt
  ansible.builtin.replace:
    path: /boot/cmdline.txt
    regexp: ' ?elevator=\S+'
    replace: ''

- name: Set system hostname
  ansible.builtin.hostname:
    name: pimeleon

- name: Update hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: '127.0.1.1 pimeleon'

- name: Configure timezone
  community.general.timezone:
    name: Etc/UTC

# Note: Service enablement happens in stage3-optimize.sh (outside chroot)
# This avoids systemctl issues in chroot environment

- name: Remove conflicting network packages
  ansible.builtin.apt:
    name:
      - dhcpcd5
      - dhcpcd-base
      - ifupdown
    state: absent
    purge: true

- name: Remove unused dependencies
  ansible.builtin.apt:
    autoremove: true
    purge: true

# Write sysctl config directly to file (avoids sysctl module failing in chroot
# when interfaces don't exist). Settings applied at boot.
- name: Configure sysctl for routing and security
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-pimeleon.conf
    content: |
      # Pimeleon Router sysctl configuration
      # Ported from production 'gw' host

      # Kernel logging (reduce console spam)
      kernel.printk = 3 4 1 3

      # Memory management
      vm.min_free_kbytes = 16384

      # IPv4 forwarding
      net.ipv4.ip_forward = 1

      # Network device queue settings (high throughput)
      net.core.netdev_max_backlog = 30000
      net.core.netdev_budget = 600
      net.core.dev_weight = 64

      # Large socket buffers for throughput
      net.core.rmem_default = 1048576
      net.core.rmem_max = 4194304
      net.core.wmem_default = 1048576
      net.core.wmem_max = 4194304

      # IPv6 forwarding disabled globally; wlan0 forwarding set by systemd-networkd
      # (IPForward=ipv6 in 10-wlan0.network) when the interface appears
      net.ipv6.conf.all.forwarding = 0
      net.ipv6.conf.default.forwarding = 0

      # IPv6 - disable on WAN interface (eth0)
      net.ipv6.conf.{{ wan_interface | default('eth0') }}.disable_ipv6 = 1
      net.ipv6.conf.{{ wan_interface | default('eth0') }}.forwarding = 0
      net.ipv6.conf.{{ wan_interface | default('eth0') }}.accept_ra = 0

      # IPv6 security
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_redirects = 0

      # IPv4 security
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.tcp_syncookies = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
    mode: '0644'

- name: Configure environment variables for tmpfs
  ansible.builtin.copy:
    dest: /etc/environment
    content: |
      # Pimeleon: Redirect temp directories to /tmp (tmpfs)
      # Reduces SD card wear by keeping temp files in RAM
      TMPDIR=/tmp
      TMP=/tmp
      TEMP=/tmp
    mode: '0644'

- name: Deploy tmpfiles.d cleanup configuration
  ansible.builtin.template:
    src: tmpfiles.d/pimeleon-cleanup.conf.j2
    dest: /etc/tmpfiles.d/pimeleon-cleanup.conf
    mode: '0644'

- name: Create necessary directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/dhcp
    - /etc/pimeleon
    - /var/log/pimeleon
    - /var/lib/pimeleon

# SSH interface access control configuration (used by pim-config)
- name: Deploy SSH interface access control config
  ansible.builtin.template:
    src: pimeleon/ssh-interfaces.conf.j2
    dest: /etc/pimeleon/ssh-interfaces.conf
    mode: '0644'

# Configure man-db for embedded environment
# Disable automatic updates during package installs (slow on SD card)
- name: Configure man-db to skip auto-updates
  ansible.builtin.copy:
    dest: /etc/default/man-db
    content: |
      # Pimeleon man-db configuration
      # Skip automatic mandb updates during package installs (saves time on SD card)
      # Manual update: sudo mandb
      OVERRIDE_NAME=""
      OVERRIDE_SITE_SEARCH=""
      OVERRIDE_SYS_MANPATH=""
      # Disable auto-update triggers
      AUTO_UPDATE=0
    mode: '0644'

- name: Create weekly mandb update cron job
  ansible.builtin.copy:
    dest: /etc/cron.weekly/man-db-update
    mode: '0755'
    content: |
      #!/bin/bash
      # Weekly man-db index update for Pimeleon
      # Auto-updates disabled to speed up package installs
      /usr/bin/mandb --quiet

# Deploy pim-config utility (raspi-config style TUI)
- name: Deploy pim-config utility
  ansible.builtin.copy:
    src: /configs/scripts/pim-config
    dest: /usr/local/bin/pim-config
    mode: '0755'
    owner: root
    group: root

- name: Ensure whiptail is installed for pim-config
  ansible.builtin.apt:
    name: whiptail
    state: present

- name: Create pimeleon directory
  ansible.builtin.file:
    path: /var/lib/pimeleon
    state: directory
    mode: '0755'

# Note: Service enablement happens in stage3-optimize.sh (outside chroot)
# These tasks are kept for non-chroot deployments (e.g., direct Ansible runs)
# Packages: htop, iotop, tcpdump, dnsutils, iputils-ping, traceroute, vim
#           hostapd, nftables, bridge-utils, wireless-tools, isc-dhcp-server
