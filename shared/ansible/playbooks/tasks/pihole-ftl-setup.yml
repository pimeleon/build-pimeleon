---
# Pi-hole configuration for Pimeleon
# Most of the installation is handled in stage2-customize.sh via the official installer

- name: Check if pihole-FTL is installed
  ansible.builtin.stat:
    path: /usr/bin/pihole-FTL
  register: pihole_ftl_bin
  when: services_enabled.pihole | default(false)

- name: Check if pihole-FTL is installed in /usr/local/bin
  ansible.builtin.stat:
    path: /usr/local/bin/pihole-FTL
  register: pihole_ftl_local_bin
  when:
    - services_enabled.pihole | default(false)
    - not (pihole_ftl_bin.stat.exists | default(false))

- name: Set pihole_ftl_path fact
  ansible.builtin.set_fact:
    pihole_ftl_path: >-
      {{ pihole_ftl_bin.stat.path if pihole_ftl_bin.stat.exists else
      (pihole_ftl_local_bin.stat.path if pihole_ftl_local_bin.stat.exists else '') }}
  when: services_enabled.pihole | default(false)

- name: Warn if Pi-hole is not installed but enabled
  ansible.builtin.debug:
    msg: "Pi-hole FTL binary not found - check stage2 logs"
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path == ""

- name: Ensure pihole group exists
  ansible.builtin.group:
    name: pihole
    system: true
    state: present
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""

- name: Ensure pihole user exists
  ansible.builtin.user:
    name: pihole
    group: pihole
    system: true
    shell: /usr/sbin/nologin
    home: /etc/pihole
    create_home: false
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""

# Ensure directories exist (redundant but safe)
- name: Create Pi-hole directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('pihole') }}"
    group: "{{ item.group | default('pihole') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/pihole, mode: '0775' }
    - { path: /etc/pihole/config_backups, mode: '0755' }
    - { path: /var/lib/pihole, mode: '0755' }
    - { path: /var/log/pihole, mode: '0755' }
    - { path: /run/pihole, mode: '0755' }
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""

- name: Create Pi-hole FTL configuration (v6)
  ansible.builtin.template:
    src: pihole/pihole.toml.j2
    dest: /etc/pihole/pihole.toml
    owner: pihole
    group: pihole
    mode: '0644'
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""
  notify: Restart pihole-FTL

- name: Create Pi-hole FTL systemd service
  ansible.builtin.template:
    src: pihole/pihole-FTL.service.j2
    dest: /etc/systemd/system/pihole-FTL.service
    mode: '0644'
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""
  notify:
    - Reload systemd
    - Restart pihole-FTL

- name: Create pihole CLI symlink
  ansible.builtin.file:
    src: "{{ pihole_ftl_path }}"
    dest: /usr/local/bin/pihole
    state: link
    force: true
  when:
    - services_enabled.pihole | default(false)
    - pihole_ftl_path != ""

# Note: pihole-FTL service enablement happens in stage3-optimize.sh (outside chroot)
