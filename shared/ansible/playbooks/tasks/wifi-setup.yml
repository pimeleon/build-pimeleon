---
# WiFi Setup Task
# Configures hostapd for wireless access point
# Note: hostapd package installed in stage2-customize.sh

- name: Ensure hostapd config directory exists
  ansible.builtin.file:
    path: /etc/hostapd
    state: directory
    mode: '0755'
  when: services_enabled.hostapd | default(true)

- name: Configure hostapd
  ansible.builtin.template:
    src: hostapd/hostapd.conf.j2
    dest: /etc/hostapd/hostapd.conf
    mode: '0600'
  when: services_enabled.hostapd | default(true)
  notify: Restart hostapd

- name: Configure hostapd defaults
  ansible.builtin.lineinfile:
    path: /etc/default/hostapd
    regexp: '^#?DAEMON_CONF='
    line: 'DAEMON_CONF="/etc/hostapd/hostapd.conf"'
    create: true
    mode: '0644'
  when: services_enabled.hostapd | default(true)

# Note: Service unmask and enablement happens in stage3-optimize.sh (outside chroot)

# Note: wlan0 network config is deployed by network-setup.yml (10-wlan0.network)

# Regulatory domain configuration (wireless-regdb installed in stage2)
- name: Set WiFi regulatory domain
  ansible.builtin.copy:
    content: |
      # WiFi regulatory domain
      REGDOMAIN={{ wifi_country_code | default('US') }}
    dest: /etc/default/crda
    mode: '0644'
  when: services_enabled.hostapd | default(true)
