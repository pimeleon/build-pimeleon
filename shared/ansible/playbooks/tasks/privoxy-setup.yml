---
# Privoxy setup tasks for Pimeleon
# Transparent HTTP proxy for ad blocking and privacy
# Note: privoxy installed in stage2-customize.sh

- name: Ensure privoxy group exists
  ansible.builtin.group:
    name: privoxy
    system: true
    state: present
  when: services_enabled.proxy_services | default(true)

- name: Ensure privoxy user exists
  ansible.builtin.user:
    name: privoxy
    group: privoxy
    system: true
    shell: /usr/sbin/nologin
    home: /etc/privoxy
    create_home: false
  when: services_enabled.proxy_services | default(true)

- name: Ensure privoxy config directory exists
  ansible.builtin.file:
    path: /etc/privoxy
    state: directory
    mode: '0755'
  when: services_enabled.proxy_services | default(true)

- name: Create privoxy log directory
  ansible.builtin.file:
    path: /var/log/privoxy
    state: directory
    owner: privoxy
    group: adm
    mode: '0750'
  when: services_enabled.proxy_services | default(true)

- name: Configure privoxy
  ansible.builtin.template:
    src: privoxy/config.j2
    dest: /etc/privoxy/config
    owner: root
    group: root
    mode: '0644'
  when: services_enabled.proxy_services | default(true)
  notify: Restart privoxy

- name: Deploy privoxy systemd service unit
  ansible.builtin.template:
    src: privoxy/privoxy.service.j2
    dest: /etc/systemd/system/privoxy.service
    owner: root
    group: root
    mode: '0644'
  when: services_enabled.privoxy | default(true)

# Note: privoxy service enablement happens in stage3-optimize.sh (outside chroot)
