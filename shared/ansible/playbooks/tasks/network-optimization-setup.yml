---
# Network optimization setup tasks for Pimeleon
# Implements CAKE QoS for bufferbloat mitigation
# Note: iproute2 installed in stage2-customize.sh

- name: Deploy bufferbloat sysctl configuration
  ansible.builtin.template:
    src: sysctl/99-network-bufferbloat.conf.j2
    dest: /etc/sysctl.d/99-network-bufferbloat.conf
    mode: '0644'
  when: services_enabled.network_optimization | default(true)

- name: Deploy network optimization service
  ansible.builtin.template:
    src: network-optimization/network-optimization.service.j2
    dest: /etc/systemd/system/network-optimization.service
    mode: '0644'
  when: services_enabled.network_optimization | default(true)

# Note: network-optimization service enablement happens in stage3-optimize.sh (outside chroot)

# ZRAM swap configuration for better memory management on Pi
- name: Deploy zram swap configuration
  ansible.builtin.template:
    src: zramswap.j2
    dest: /etc/default/zramswap
    mode: '0644'
  when: services_enabled.zram | default(true)

# Note: zramswap service enablement happens in stage3-optimize.sh (outside chroot)
