---
# Firewall Setup Task
# Configures nftables for routing, NAT, and security
# Note: nftables installed in stage2-customize.sh (replaces iptables)

- name: Create nftables configuration directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    mode: '0755'
  when: services_enabled.firewall | default(true)

- name: Deploy SSH access control nftables rules
  ansible.builtin.template:
    src: nftables/ssh-access.nft.j2
    dest: /etc/nftables.d/ssh-access.nft
    mode: '0644'
  when: services_enabled.firewall | default(true)

- name: Configure nftables rules
  ansible.builtin.template:
    src: nftables/nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  when: services_enabled.firewall | default(true)
  notify: Reload nftables

- name: Enable IP forwarding (IPv4)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  when: services_enabled.firewall | default(true)

- name: Enable IP forwarding (IPv6)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  when: services_enabled.firewall | default(true)

- name: Configure security sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
    - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
  when: services_enabled.firewall | default(true)

# Note: nftables service enablement happens in stage3-optimize.sh (outside chroot)
# Note: fail2ban configuration handled in tasks/fail2ban-setup.yml
