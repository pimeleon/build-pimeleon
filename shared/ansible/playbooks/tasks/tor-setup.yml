---
# Tor installation from APT package
# Provides anonymity network routing
# Uses Debian's maintained Tor package for reliability

- name: Check if Tor is already installed (built from source)
  ansible.builtin.stat:
    path: /usr/local/bin/tor
  register: tor_source_bin

- name: Install Tor from APT
  ansible.builtin.apt:
    name:
      - tor
      - tor-geoipdb
    state: present
    update_cache: false
  when:
    - services_enabled.tor | default(false)
    - not (tor_source_bin.stat.exists | default(false))

- name: Ensure debian-tor group exists
  ansible.builtin.group:
    name: debian-tor
    system: true
    state: present
  when: services_enabled.tor | default(false)

- name: Ensure debian-tor user exists
  ansible.builtin.user:
    name: debian-tor
    group: debian-tor
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/tor
    create_home: false
  when: services_enabled.tor | default(false)

- name: Ensure tor config directory exists
  ansible.builtin.file:
    path: /etc/tor
    state: directory
    mode: '0755'
  when: services_enabled.tor | default(false)

- name: Create tor directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('debian-tor') }}"
    group: "{{ item.group | default('debian-tor') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/tor, mode: '0700' }
    - { path: /var/log/tor, mode: '0750' }
    - { path: /run/tor, mode: '0755' }
  when: services_enabled.tor | default(false)

- name: Configure Tor
  ansible.builtin.template:
    src: tor/torrc.j2
    dest: /etc/tor/torrc
    owner: root
    group: debian-tor
    mode: '0640'
  when: services_enabled.tor | default(false)
  notify: Restart tor

- name: Create Tor systemd service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/tor@default.service.d
    state: directory
    mode: '0755'
  when: services_enabled.tor | default(false)

- name: Configure Tor systemd service override
  ansible.builtin.template:
    src: tor/tor.service.j2
    dest: /etc/systemd/system/tor@default.service.d/override.conf
    mode: '0644'
  when: services_enabled.tor | default(false)
  notify:
    - Reload systemd
    - Restart tor

# Note: Tor service enablement happens in stage3-optimize.sh (outside chroot)
