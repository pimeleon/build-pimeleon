---
# Tor installation from official Tor Project repository
# https://support.torproject.org/little-t-tor/getting-started/installing/
# Provides anonymity network routing with automatic security updates

- name: Install Tor repository prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - gnupg
    state: present
    update_cache: false
  when: services_enabled.tor | default(false)

- name: Create keyrings directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: services_enabled.tor | default(false)

- name: Download Tor Project GPG key
  ansible.builtin.get_url:
    url: https://deb.torproject.org/torproject.org/A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89.asc
    dest: /tmp/tor-keyring.asc
    mode: '0644'
  when: services_enabled.tor | default(false)

- name: Convert Tor GPG key to keyring format
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/deb.torproject.org-keyring.gpg /tmp/tor-keyring.asc
    creates: /usr/share/keyrings/deb.torproject.org-keyring.gpg
  when: services_enabled.tor | default(false)

- name: Remove temporary GPG key file
  ansible.builtin.file:
    path: /tmp/tor-keyring.asc
    state: absent
  when: services_enabled.tor | default(false)

- name: Add Tor Project repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tor.sources
    content: |
      Types: deb deb-src
      URIs: https://deb.torproject.org/torproject.org/
      Suites: {{ raspbian_version | default('bookworm') }}
      Components: main
      Signed-By: /usr/share/keyrings/deb.torproject.org-keyring.gpg
    mode: '0644'
  when: services_enabled.tor | default(false)

- name: Update apt cache for Tor repository
  ansible.builtin.apt:
    update_cache: true
  when: services_enabled.tor | default(false)

- name: Install Tor from official repository
  ansible.builtin.apt:
    name:
      - tor
    state: present
    update_cache: false
  when: services_enabled.tor | default(false)

- name: Create tor directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('debian-tor') }}"
    group: "{{ item.group | default('debian-tor') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/tor, mode: '0700' }
    - { path: /var/log/tor, mode: '0750' }
    - { path: /run/tor, mode: '0755' }
  when: services_enabled.tor | default(false)

- name: Configure Tor
  ansible.builtin.template:
    src: tor/torrc.j2
    dest: /etc/tor/torrc
    owner: root
    group: debian-tor
    mode: '0640'
  when: services_enabled.tor | default(false)
  notify: Restart tor

# Note: Tor service enablement happens in stage3-optimize.sh (outside chroot)
# The package installs its own systemd service file
