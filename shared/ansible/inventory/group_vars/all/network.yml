---
# Network configuration defaults
# Values can be overridden via environment variables (see .env.defaults)

# Interface naming
wan_interface: "eth0"
lan_interface: "eth1"
wifi_interface: "wlan0"
mgmt_interface: "eth0:0"

# Interface availability
ethernet_available: true      # Override for Zero W (no Ethernet)
lan_interface_enabled: false  # Disable eth1 by default (requires USB adapter on Pi 3B+)

# WiFi AP network settings (PRIMARY LAN via wlan0)
# wlan0 is the primary interface on Pi 3B+ (eth1 requires USB adapter)
wifi_ap_ip: "{{ lookup('env', 'WIFI_GATEWAY') | default('192.168.42.1', true) }}"
wifi_ap_netmask: "255.255.255.0"
wifi_ap_netmask_cidr: "24"
wifi_ap_network: "{{ lookup('env', 'WIFI_NETWORK') | default('192.168.42.0/24', true) }}"

# LAN network settings (secondary via eth1, if USB adapter present)
lan_ip: "{{ lookup('env', 'LAN_GATEWAY') | default('192.168.43.1', true) }}"
lan_netmask: "255.255.255.0"
lan_netmask_cidr: "24"
lan_network: "{{ lookup('env', 'LAN_NETWORK') | default('192.168.43.0/24', true) }}"

# Management network (from environment or defaults)
mgmt_ip: "{{ lookup('env', 'MGMT_GATEWAY') | default('172.16.10.1', true) }}"
mgmt_netmask: "255.255.255.0"
mgmt_network: "{{ lookup('env', 'MGMT_NETWORK') | default('172.16.10.0/24', true) }}"

# DHCP configuration (from environment or defaults)
# WiFi (wlan0) is primary - uses 192.168.42.x
wifi_dhcp_range_start: "192.168.42.100"
wifi_dhcp_range_end: "192.168.42.254"
dhcp_lease_time: "12h"

# LAN (eth1) is secondary - uses 192.168.43.x
dhcp_range_start: "{{ lookup('env', 'LAN_DHCP_START') | default('192.168.43.100', true) }}"
dhcp_range_end: "{{ lookup('env', 'LAN_DHCP_END') | default('192.168.43.254', true) }}"

# WiFi AP configuration (from environment or defaults)
wifi_ssid: "{{ lookup('env', 'WIFI_SSID') | default('pimeleon', true) }}"
wifi_passphrase: "{{ lookup('env', 'WIFI_PASSPHRASE') | default('changeme123', true) }}"
wifi_channel: "{{ lookup('env', 'WIFI_CHANNEL') | default('6', true) | int }}"
wifi_hw_mode: "{{ lookup('env', 'WIFI_MODE') | default('g', true) }}"
wifi_country_code: "{{ lookup('env', 'WIFI_COUNTRY') | default('US', true) }}"

# Hostapd advanced settings
hostapd_log_level: 2              # 0=verbose, 1=debug, 2=info, 3=notice, 4=warning
hostapd_require_ht: true          # Require 802.11n
hostapd_wps_state: 2              # 0=disabled, 1=enabled unconfigured, 2=enabled configured
hostapd_beacon_int: 200           # Beacon interval (ms) - 200 for iOS compatibility
hostapd_dtim_period: 2            # DTIM beacon multiplier
hostapd_ap_max_inactivity: 600    # Max inactivity timeout (seconds)
hostapd_wpa_group_rekey: 3600     # Group key rekey interval (seconds)
hostapd_ap_isolate: false         # Client isolation (disable for LAN access)

# IPv6 configuration (ULA prefix fd00:1:xx::/64)
ipv6_enabled: true
wifi_ipv6: "fd00:1:42::1"   # wlan0 primary (192.168.42.x)
lan_ipv6: "fd00:1:43::1"    # eth1 secondary (192.168.43.x)

# DNS configuration
dns_domain: "pimeleon.local"

# Port assignments (from environment or defaults)
dnscrypt_port: "{{ lookup('env', 'DNSCRYPT_PORT') | default('5054', true) | int }}"
pihole_port: "{{ lookup('env', 'PIHOLE_PORT') | default('5553', true) | int }}"
bind9_upstream_port: "{{ lookup('env', 'PIHOLE_PORT') | default('5553', true) | int }}"
privoxy_port: "{{ lookup('env', 'PRIVOXY_PORT') | default('8118', true) | int }}"

dnscrypt_servers:
  - "cloudflare"
  - "google"
dnscrypt_require_dnssec: true
dnscrypt_require_nolog: true
dnscrypt_require_nofilter: true

# Upstream DNS fallback (not used when dnscrypt-proxy is enabled)
upstream_dns:
  - "8.8.8.8"
  - "8.8.4.4"

# CAKE QoS bandwidth limits (bufferbloat mitigation)
# Values from working gw Pi3 configuration
wan_bandwidth: "200mbit"
lan_bandwidth: "500mbit"
wifi_bandwidth: "40mbit"

# NTP servers for DHCP clients (external pool for accurate time)
# Using pool.ntp.org for global coverage; override for regional servers
ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"

# Port forwarding rules (empty by default)
# Format: { proto: "tcp/udp", port: 12345, dest: "192.168.42.10" }
# Example:
#   port_forwards:
#     - { proto: "tcp", port: 22, dest: "192.168.42.10" }
#     - { proto: "udp", port: 51820, dest: "192.168.42.20" }
port_forwards: []
