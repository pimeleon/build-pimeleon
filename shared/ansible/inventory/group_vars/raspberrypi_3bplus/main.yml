---
# Raspberry Pi 3 Model B+ specific configuration

platform_model: "3B+"
display_name: "Raspberry Pi 3 Model B+"

# Hardware specs
architecture: "armhf"
soc: "BCM2710"
cpu_cores: 4
cpu_freq_default: 1200
cpu_freq_max: 1400
ram_mb: 1024

# Device tree
device_tree: "bcm2710-rpi-3-b-plus.dtb"
device_tree_overlays:
  - "pi3-disable-bt.dtbo"

# Network interfaces
# WAN: eth0 (onboard, connects to upstream router/modem)
# WiFi: wlan0 (WiFi AP, wireless clients)
wan_interface: "eth0"
wifi_interface: "wlan0"

# Network performance
ethernet_available: true
ethernet_max_speed_mbps: 300
wifi_max_speed_mbps: 100

# CAKE QoS bandwidth limits (from working gw)
wan_bandwidth: "200mbit"
wifi_bandwidth: "40mbit"

# config.txt parameters
config_txt:
  enable_uart: 1
  dtparam_spi: "on"
  dtparam_i2c: "on"
  dtparam_i2s: "on"
  gpu_mem: 64
  arm_freq: 1000
  over_voltage: 2
  max_usb_current: 1

# hostapd WiFi capabilities (2.4GHz only for best compatibility)
wifi_hw_mode: "g"
wifi_channel: 6
hostapd_ht_capab: "[HT40+][HT40-][SHORT-GI-20][SHORT-GI-40][TX-STBC][RX-STBC1]"
hostapd_vht_enabled: false
hostapd_max_sta: 10
