---
# Raspberry Pi family defaults

platform_family: "raspberrypi"
bootloader_type: "pi-firmware"

# Kernel and firmware packages
kernel_package: "raspberrypi-kernel"
firmware_packages:
  - libraspberrypi-bin
  - libraspberrypi0
  - firmware-brcm80211

# Boot partition
boot_partition_size: "256M"
boot_partition_fs: "vfat"

# Pi-specific hardware features
hardware_features:
  uart: true
  spi: true
  i2c: true
  gpio: true
  camera: true
  audio: true
  wifi: true
  bluetooth: true
