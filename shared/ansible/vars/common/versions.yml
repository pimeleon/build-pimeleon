---
# Centralized version management for Pimeleon
# All service versions defined here for easy updates
#
# Sources:
# - Tor: https://www.torproject.org/download/tor/
# - dnscrypt-proxy: https://github.com/DNSCrypt/dnscrypt-proxy/releases
# - hostapd/wpa_supplicant: https://w1.fi/
# - Pi-hole: https://github.com/pi-hole/FTL/releases
# - Privoxy: https://www.privoxy.org/
# - BIND9: https://www.isc.org/bind/
# - Kea DHCP: https://www.isc.org/kea/
# - nftables: https://netfilter.org/projects/nftables/
# - fail2ban: https://github.com/fail2ban/fail2ban/releases

# =============================================================================
# BUILD FROM SOURCE - Latest versions compiled during image build
# =============================================================================

versions_source:
  # Anonymity/Privacy
  tor: "0.4.8.21"

  # DNS encryption
  dnscrypt_proxy: "2.1.15"

  # WiFi access point (WPA3 support)
  hostapd: "2.11"
  wpa_supplicant: "2.11"

  # Ad blocking (FTL only, no web interface)
  pihole_ftl: "6.4"
  pihole_core: "6.3"

# =============================================================================
# APT PACKAGES - Version pinning for reproducible builds
# =============================================================================

versions_apt:
  # Privacy proxy
  privoxy: "4.1.*"

  # DNS server
  bind9: "1:9.20.*"

  # DHCP server (Kea replaces deprecated isc-dhcp-server)
  kea_dhcp4: "2.6.*"
  # Legacy fallback (EOL - use only if Kea unavailable)
  isc_dhcp_server: "4.4.*"

  # Firewall
  nftables: "1.1.*"

  # Intrusion prevention
  fail2ban: "1.1.*"

  # SSH
  openssh_server: "1:9.*"

  # Caching proxy (optional)
  squid: "6.*"

# =============================================================================
# PLATFORM FIRMWARE - Raspberry Pi specific
# =============================================================================

versions_firmware:
  # Use 'latest' for rolling updates or pin specific version
  raspberrypi_kernel: "latest"
  raspberrypi_bootloader: "latest"
  linux_firmware: "latest"

# =============================================================================
# BUILD DEPENDENCIES - For source builds
# =============================================================================

versions_build_deps:
  # Tor dependencies
  libevent: "2.1.*"
  openssl: "3.*"

  # hostapd/wpa_supplicant dependencies
  libnl: "3.*"

  # dnscrypt-proxy (Go binary, no build deps)

  # Pi-hole FTL dependencies
  libnettle: "8.*"
  libgmp: "6.*"

# =============================================================================
# CHECKSUMS - SHA256 for source tarballs (updated with versions)
# =============================================================================

checksums:
  tor: "sha256:auto"  # Downloaded from torproject.org with .sha256sum
  dnscrypt_proxy: "sha256:auto"  # GitHub releases include checksums
  hostapd: "sha256:auto"  # w1.fi provides checksums
  pihole_ftl: "sha256:auto"  # GitHub releases include checksums

# =============================================================================
# BUILD FROM SOURCE FLAGS - Enable/disable source builds per service
# =============================================================================

build_from_source:
  # Always build from source (security-critical)
  tor: true
  dnscrypt_proxy: true
  pihole_ftl: true

  # Optional source builds (enable for WPA3/latest features)
  hostapd: true
  wpa_supplicant: false  # Usually apt is sufficient

  # APT preferred (well-maintained packages)
  bind9: false
  privoxy: false
  nftables: false
  fail2ban: false
