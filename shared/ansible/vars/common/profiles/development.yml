---
# Development Profile - Maximal + Debug Configuration
# All services enabled + debug tools and extended logging

profile_name: "development"
profile_description: "Full-featured development build with all services and debug tools"

# Service enablement flags - ALL ENABLED + debug tools
services_enabled:
  # Tier 1: Core
  networkd: true
  wpa_supplicant: false
  hostapd: true
  dhcp_server: true
  dns_server: true
  firewall: true
  ssh: true
  fail2ban: true

  # Tier 2: DNS Stack (full)
  pihole: true
  dnscrypt_proxy: true

  # Tier 3: Proxy Services (all enabled)
  privoxy: true
  squid: true
  tor: true

  # Tier 4: Web & API
  nginx: true
  pimeleon_api: true
  ddclient: true

  # Tier 5: File Sharing
  samba: true
  nfs: true

  # Tier 6: Supporting
  avahi: true
  postfix: false
  zram: true
  swapfile: true

# Build from source overrides
build_from_source:
  pihole_ftl: false
  hostapd: false
  tor: false

# Development packages - debug and diagnostic tools
dev_packages:
  - htop
  - iotop
  - iftop
  - tcpdump
  - nmap
  - netcat-openbsd
  - strace
  - ltrace
  - lsof
  - vim
  - nano
  - tmux
  - screen
  - git
  - curl
  - wget
  - jq
  - tree
  - rsync
  - dnsutils
  - bind9-dnsutils
  - net-tools
  - iproute2
  - bridge-utils
  - ethtool
  - wireless-tools
  - iw
  - procps
  - psmisc
  - file
  - less
  - gdb
  - valgrind

# Extended logging for development
logging:
  level: debug
  journal_persistent: true
  max_journal_size: "500M"
  rsyslog_debug: true

# SSH configuration (permissive for dev)
ssh:
  port: 22                       # Standard port for convenience
  permit_root_login: "no"
  password_authentication: true  # Enabled for dev convenience
  pubkey_authentication: true
  max_auth_tries: 6
  client_alive_interval: 0       # No timeout for debugging

# Samba configuration (development)
samba:
  enabled: true
  workgroup: "PIMELEON"
  shares:
    - name: "backup"
      path: "/srv/backup"
      writable: true
      guest_ok: false
      valid_users: "pi"
      comment: "Local backup share"
    - name: "logs"
      path: "/var/log"
      writable: false
      guest_ok: false
      valid_users: "pi"
      comment: "System logs (read-only)"

# NFS configuration (development)
nfs:
  enabled: true
  exports:
    - path: "/srv/backup"
      clients: "192.168.42.0/24(rw,sync,no_subtree_check)"
    - path: "/home/pi"
      clients: "192.168.42.0/24(rw,sync,no_subtree_check,no_root_squash)"

# Squid proxy (development)
squid:
  enabled: true
  http_port: 3128
  cache_mem: "64 MB"
  maximum_object_size: "64 MB"
  cache_dir_size: 1000

# Tor configuration (development)
tor:
  enabled: true
  socks_port: 9050
  control_port: 9051
  transparent_port: 9040

# Firewall (permissive for dev - all ports open)
firewall:
  default_input_policy: "drop"
  default_forward_policy: "drop"
  allow_ping: true
  rate_limit_ssh: false          # No rate limiting for dev
  open_ports:
    - { port: 22, proto: tcp, comment: "SSH" }
    - { port: 53, proto: "tcp,udp", comment: "DNS" }
    - { port: 67, proto: udp, comment: "DHCP" }
    - { port: 80, proto: tcp, comment: "HTTP" }
    - { port: 443, proto: tcp, comment: "HTTPS" }
    - { port: 139, proto: tcp, comment: "SMB" }
    - { port: 445, proto: tcp, comment: "SMB" }
    - { port: 2049, proto: "tcp,udp", comment: "NFS" }
    - { port: 3128, proto: tcp, comment: "Squid" }
    - { port: 5000, proto: tcp, comment: "API" }
    - { port: 8080, proto: tcp, comment: "Dev HTTP" }
    - { port: 8118, proto: tcp, comment: "Privoxy" }
    - { port: 9050, proto: tcp, comment: "Tor SOCKS" }
    - { port: 9090, proto: tcp, comment: "Debug" }

# Development optimizations
optimizations:
  # Keep services running for debugging
  disable_services: []

  # Kernel parameters
  sysctl:
    net.ipv4.ip_forward: 1
    net.ipv6.conf.all.forwarding: 1
    # Less restrictive for dev
    net.ipv4.conf.all.log_martians: 0
