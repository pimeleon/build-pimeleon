---
# Production Profile - Full-Featured Configuration
# All services enabled - matches production gw host

profile_name: "production"
profile_description: "Full-featured production build with all services"

# Service enablement flags - ALL ENABLED
services_enabled:
  # Tier 1: Core
  networkd: true
  hostapd: true
  dhcp_server: true
  dns_server: true
  firewall: true
  ssh: true
  fail2ban: true

  # Tier 2: DNS Stack (full)
  pihole: true
  dnscrypt_proxy: true

  # Tier 3: Proxy Services (all enabled)
  privoxy: true
  squid: true
  tor: true

  # Tier 4: Web & API
  nginx: true
  pi_router_api: true
  ddclient: true

  # Tier 5: File Sharing
  samba: true
  nfs: true

  # Tier 6: Supporting
  avahi: true
  postfix: false     # Usually not needed
  zram: true
  swapfile: true

# Build from source overrides
build_from_source:
  pihole_ftl: true
  hostapd: true
  tor: true

# Minimal packages for production (no debug tools)
dev_packages: []

# Production logging (minimal)
logging:
  level: warning
  journal_persistent: true
  max_journal_size: "100M"
  rsyslog_debug: false

# Samba configuration (production)
samba:
  enabled: true
  workgroup: "PIMELEON"
  shares:
    - name: "backup"
      path: "/srv/backup"
      writable: true
      guest_ok: false
      valid_users: "pi"
      comment: "Backup share"
    - name: "media"
      path: "/srv/media"
      writable: true
      guest_ok: false
      valid_users: "pi"
      comment: "Media share"

# NFS configuration (production)
nfs:
  enabled: true
  exports:
    - path: "/srv/backup"
      clients: "192.168.42.0/24(rw,sync,no_subtree_check)"
    - path: "/srv/media"
      clients: "192.168.42.0/24(rw,sync,no_subtree_check)"

# Squid proxy (production - caching)
squid:
  enabled: true
  http_port: 3128
  cache_mem: "64 MB"
  maximum_object_size: "64 MB"
  cache_dir_size: 1000  # MB

# Tor configuration (production)
tor:
  enabled: true
  socks_port: 9050
  control_port: 9051
  transparent_port: 9040
  dns_port: 9053

# SSH configuration (hardened)
ssh:
  port: 24442                    # Non-standard port (matches gw)
  permit_root_login: "no"
  password_authentication: false  # Key-only in production
  pubkey_authentication: true
  max_auth_tries: 3
  client_alive_interval: 300
  client_alive_count_max: 2

# Firewall (strict - matches gw host)
firewall:
  default_input_policy: "drop"
  default_forward_policy: "drop"
  allow_ping: true
  rate_limit_ssh: true
  open_ports:
    # Management
    - { port: 24442, proto: tcp, comment: "SSH (non-standard)" }
    # DNS
    - { port: 53, proto: "tcp,udp", comment: "DNS" }
    # DHCP
    - { port: 67, proto: udp, comment: "DHCP" }
    # Web
    - { port: 80, proto: tcp, comment: "HTTP" }
    - { port: 443, proto: tcp, comment: "HTTPS" }
    - { port: 8443, proto: tcp, comment: "GitLab/Alt HTTPS" }
    # API (LAN only)
    - { port: 5000, proto: tcp, comment: "API", source: "192.168.42.0/24" }
    # File sharing (LAN only)
    - { port: 139, proto: tcp, comment: "SMB", source: "192.168.42.0/24" }
    - { port: 445, proto: tcp, comment: "SMB", source: "192.168.42.0/24" }
    - { port: 2049, proto: "tcp,udp", comment: "NFS", source: "192.168.42.0/24" }
    # Proxy (LAN only)
    - { port: 3128, proto: tcp, comment: "Squid", source: "192.168.42.0/24" }
    - { port: 8118, proto: tcp, comment: "Privoxy", source: "192.168.42.0/24" }
    # Tor
    - { port: 4439, proto: tcp, comment: "Tor" }
    - { port: 9050, proto: tcp, comment: "Tor SOCKS", source: "192.168.42.0/24" }

# NAT rules
nat:
  masquerade:
    - { from: "wlan0", to: "eth0", comment: "WiFi to WAN" }
  redirect:
    - { port: 80, to_port: 8118, proto: tcp, comment: "HTTP to Privoxy" }
  forward:
    - { port: 33996, proto: tcp, dest: "192.168.42.10", comment: "Custom forward" }
    - { port: 50044, proto: udp, dest: "192.168.42.10", comment: "Custom forward" }

# Production optimizations
optimizations:
  # Disable unnecessary services
  disable_services:
    - bluetooth
    - hciuart
    - triggerhappy

  # Kernel parameters for routing (matches gw host)
  sysctl:
    net.ipv4.ip_forward: 1
    net.ipv6.conf.all.forwarding: 1
    net.ipv4.conf.all.send_redirects: 0
    net.ipv4.conf.all.accept_redirects: 0
    net.ipv4.conf.all.accept_source_route: 0
    net.ipv4.conf.all.log_martians: 1
    net.ipv4.tcp_syncookies: 1
    net.ipv4.icmp_echo_ignore_broadcasts: 1
    # Performance tuning
    net.core.somaxconn: 1024
    net.ipv4.tcp_max_syn_backlog: 2048
    net.core.netdev_max_backlog: 2048
