---
# Service configuration defaults

# Services enabled flags (used by playbook tasks)
services_enabled:
  dns_server: true
  dnscrypt_proxy: true
  dhcp_server: true
  wifi_ap: true
  pihole: true   # DNS filtering via Pi-hole FTL (web UI disabled)
  firewall: true
  proxy_services: true
  filesharing: false

# Services to enable at boot
enabled_services:
  essential:
    - ssh
    - systemd-networkd
    - rsyslog
  network:
    - bind9
    - isc-dhcp-server
    - pihole-FTL
    - dnscrypt-proxy
    - nftables
  optional:
    - hostapd

# Services to disable
disabled_services:
  - dhcpcd
  - networking
  - wpa_supplicant
  - bluetooth
  - avahi-daemon
  - systemd-resolved  # Using bind9 instead

# Service package mapping
service_packages:
  dhcp: "isc-dhcp-server"
  dns: "bind9"
  dns_utils: "bind9utils dnsutils"
  dns_encrypt: "dnscrypt-proxy"
  wifi_ap: "hostapd"
  firewall: "nftables"
