stages:
  - lint
  - build
  - test
  - scan
  - publish
  - deploy
  - docs

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  BUILD_IMAGE: ${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_REF_SLUG}
  TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:${CI_COMMIT_REF_SLUG}

before_script:
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# Lint stage
lint:yaml:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install yamllint
  script:
    - yamllint -c .yamllint .
  allow_failure: true

lint:ansible:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ansible-lint
  script:
    - ansible-lint ansible/playbooks/*.yml
  allow_failure: true

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  script:
    - find . -name "*.sh" -type f -exec shellcheck {} \;
  allow_failure: true

# Build stage
build:containers:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker build -t $BUILD_IMAGE ./containers/builder
    - docker build -t $TEST_IMAGE ./containers/tester
    - docker push $BUILD_IMAGE
    - docker push $TEST_IMAGE

build:pimeleon:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  needs: ["build:containers"]
  script:
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/output \
        -v $CI_PROJECT_DIR/cache:/cache \
        -v $CI_PROJECT_DIR/configs:/configs \
        -v $CI_PROJECT_DIR/ansible:/ansible \
        -e BUILD_CACHE_DIR=/cache \
        -e OUTPUT_DIR=/output \
        -e RPI_MODEL=3B+ \
        -e RASPBIAN_VERSION=bookworm \
        $BUILD_IMAGE
  artifacts:
    paths:
      - output/*.tar.gz
    expire_in: 1 week

# Test stage
test:smoke:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  needs: ["build:pimeleon", "build:containers"]
  script:
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -e TEST_SUITE=smoke \
        $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - tests/results/
    reports:
      junit: tests/results/junit.xml
    expire_in: 1 week

test:integration:
  stage: test
  image: docker:24-dind
  services:
    - docker:24-dind
  needs: ["build:pimeleon", "build:containers"]
  script:
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -e TEST_SUITE=integration \
        $TEST_IMAGE
  timeout: 30 minutes
  allow_failure: true

# Security scan stage
security:trivy:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --no-progress --format template --template "@contrib/gitlab.tpl" -o gl-container-scanning-report.json .
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json

security:secrets:
  stage: scan
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog filesystem . --json > secrets-report.json || true
  artifacts:
    paths:
      - secrets-report.json
    expire_in: 1 week

# Publish stage
publish:image:
  stage: publish
  image: docker:24-dind
  services:
    - docker:24-dind
  needs: ["build:pimeleon", "test:smoke"]
  only:
    - main
    - tags
  script:
    - cd output
    - tar -xzf pimeleon-*.tar.gz
    - |
      for file in pimeleon-*/*.img.xz; do
        curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "$file" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pimeleon/${CI_COMMIT_TAG:-latest}/$(basename $file)"
      done

publish:pages:
  stage: publish
  image: python:3.11-slim
  needs: ["test:smoke"]
  script:
    - pip install sphinx sphinx-rtd-theme myst-parser
    - cd docs && make html
    - mv _build/html ../public
  artifacts:
    paths:
      - public
  only:
    - main

# Deploy stage
deploy:staging:
  stage: deploy
  image: alpine:latest
  needs: ["publish:image"]
  environment:
    name: staging
    url: https://staging.pimeleon.example.com
  before_script:
    - apk add --no-cache curl openssh-client
  script:
    - echo "Deploying to staging environment"
    # Add deployment commands here
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  needs: ["publish:image"]
  environment:
    name: production
    url: https://pimeleon.example.com
  before_script:
    - apk add --no-cache curl openssh-client
  script:
    - echo "Deploying to production environment"
    # Add deployment commands here
  only:
    - tags
  when: manual

# Documentation deployment triggers
docs:trigger-production:
  stage: docs
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      # Update submodule to latest master
      git submodule update --remote --merge docs-web
      # Trigger docs-web pipeline for production deployment
      curl --request POST \
           --form token=$DOCS_WEB_TRIGGER_TOKEN \
           --form ref=master \
           "https://gitlab.pimeleon.dev:8443/api/v4/projects/pimeleon%2Fdocs-web/trigger/pipeline"
  only:
    - master
    - tags
  when: on_success

docs:trigger-preview:
  stage: docs
  image: alpine:latest
  before_script:
    - apk add --no-cache curl git
  script:
    - |
      # Update submodule to latest preview
      git submodule update --remote --merge docs-web
      # Trigger docs-web pipeline for preview deployment
      curl --request POST \
           --form token=$DOCS_WEB_TRIGGER_TOKEN \
           --form ref=preview \
           "https://gitlab.pimeleon.dev:8443/api/v4/projects/pimeleon%2Fdocs-web/trigger/pipeline"
  only:
    - develop
    - preview
  when: on_success