# GitLab CI/CD Pipeline for Pimeleon
# Raspberry Pi networking image builder
# Optimized with best practices from n8n-deploy

stages:
  - .pre
  - scan
  - lint
  - build
  - test
  - publish
  - release
  - docs

variables:
  DOCKER_BUILDKIT: 1
  BUILD_IMAGE: ${CI_REGISTRY_IMAGE}/builder:${CI_COMMIT_REF_SLUG}
  TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:${CI_COMMIT_REF_SLUG}
  APT_PROXY: "192.168.76.5:3142"
  GIT_DEPTH: 0

# Global defaults for all jobs
default:
  tags:
    - linux
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  interruptible: true

# Docker job template with registry authentication
# Runner has host docker socket mounted, no dind needed
# Uses CI_REGISTRY_PASSWORD for read-write access (CI_JOB_TOKEN is read-only)
.docker-job:
  image: docker:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  tags:
    - containers

# Workflow rules - smart pipeline triggering
workflow:
  rules:
    # Run on develop (common codebase)
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    # Run on platform release branches
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi[34]-/'
      when: always
    # Run on all tags
    - if: '$CI_COMMIT_TAG'
      when: always
    # Run on merge requests targeting develop
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      when: always
    # Manual workflow dispatch
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    # Run security checks on conventional commit branches
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: always
    # Skip for all other cases
    - when: never

# ============================================
# PRE STAGE - Cache warming
# ============================================

# Cache status check - pull existing cache for build:pimeleon
# Note: No docker-in-docker here; cache creation happens in build:pimeleon
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: never
    - when: on_success
  cache:
    key: base-system-${TARGET_PLATFORM:-rpi3-bookworm}
    paths:
      - cache/
    policy: pull-push
  script:
    - mkdir -p cache
    - |
      CACHE_FILE="cache/pimeleon-${TARGET_PLATFORM:-rpi3-bookworm}-base.tar.gz"
      if [ -f "$CACHE_FILE" ]; then
        echo "Cache found: $CACHE_FILE"
        ls -lh "$CACHE_FILE"
      else
        echo "Cache not found, will be created by build:pimeleon"
      fi

# ============================================
# SECURITY SCAN STAGE
# ============================================

security:trivy:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  tags:
    - linux
  rules:
    - when: on_success
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
    policy: pull-push
  variables:
    TRIVY_CACHE_DIR: .trivy-cache
  script:
    - mkdir -p ${TRIVY_CACHE_DIR}/db
    - |
      # Download DB if not cached
      if [ ! -f "${TRIVY_CACHE_DIR}/db/trivy.db" ]; then
        echo "Downloading Trivy DB with retries..."
        for i in 1 2 3; do
          trivy image --download-db-only --cache-dir ${TRIVY_CACHE_DIR} && break
          echo "Retry $i failed, waiting..."
          sleep 10
        done
      fi
    - trivy fs --config trivy.yaml --cache-dir ${TRIVY_CACHE_DIR} --skip-db-update --exit-code 0 --no-progress --scanners vuln --format json -o trivy-report.json .
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 1 week

security:gitleaks:
  stage: scan
  image: python:3.11-slim
  tags:
    - linux
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  before_script:
    - apt-get -q update && apt-get -qy install git wget
    - wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz -C /usr/local/bin
  script:
    - echo "Running secret detection with gitleaks..."
    - gitleaks git . --verbose --redact --config .gitleaks.toml
    - echo "Secret detection completed"

# ============================================
# LINT STAGE
# ============================================

lint:yaml:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  before_script:
    - pip install --quiet yamllint
  script:
    - yamllint -c .yamllint .
  allow_failure: true

lint:ansible:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  before_script:
    - pip install --quiet ansible-lint
  script:
    - ansible-lint shared/ansible/playbooks/*.yml
  allow_failure: true

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  tags:
    - linux
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - find . -name "*.sh" -type f -exec shellcheck {} \;
  allow_failure: true

# ============================================
# BUILD STAGE
# ============================================

build:containers:
  extends: .docker-job
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: never
    - when: on_success
  script:
    - docker build --cache-from ${CI_REGISTRY_IMAGE}/builder:latest -t $BUILD_IMAGE -t ${CI_REGISTRY_IMAGE}/builder:latest -f ./shared/containers/builder/Dockerfile .
    # Tester: no-cache to ensure scripts are always copied fresh
    - docker build --no-cache -t $TEST_IMAGE -t ${CI_REGISTRY_IMAGE}/tester:latest ./shared/containers/tester
    - docker push $BUILD_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/builder:latest
    - docker push $TEST_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/tester:latest

build:pimeleon:
  extends: .docker-job
  stage: build
  needs: ["warm-cache", "build:containers"]
  cache:
    key: base-system-${TARGET_PLATFORM:-rpi3-bookworm}
    paths:
      - cache/
    policy: pull
  rules:
    # Skip on feature branches
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: never
    # RPi 3B+ builds (release/rpi3-* branches)
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi3-/'
      variables:
        TARGET_PLATFORM: "rpi3-bookworm"
    # RPi 4B builds (release/rpi4-* branches)
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi4-/'
      variables:
        TARGET_PLATFORM: "rpi4-bookworm"
    # Default for develop (use RPi 3B+ as reference build)
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        TARGET_PLATFORM: "rpi3-bookworm"
    - when: on_success
  script:
    - echo "Building Pimeleon app ${TARGET_PLATFORM:-rpi3-bookworm}..."
    - mkdir -p output cache
    - |
      # Calculate version from conventional commits
      chmod +x ./shared/scripts/get-next-version.sh
      PIMELEON_VERSION=$(./shared/scripts/get-next-version.sh "${TARGET_PLATFORM:-rpi3-bookworm}")
      echo "Building version: ${PIMELEON_VERSION}"
    - |
      # Create container, copy scripts, then start
      CONTAINER_ID=$(docker create \
        --privileged \
        -v /dev:/dev:rw \
        -v $CI_PROJECT_DIR/output:/output \
        -v $CI_PROJECT_DIR/cache:/cache \
        -v $CI_PROJECT_DIR/configs:/configs \
        -v $CI_PROJECT_DIR/shared/ansible:/ansible:ro \
        -e WORKSPACE_DIR=/workspace \
        -e CACHE_DIR=/cache \
        -e OUTPUT_DIR=/output \
        -e TARGET_PLATFORM=${TARGET_PLATFORM:-rpi3-bookworm} \
        -e PIMELEON_VERSION=${PIMELEON_VERSION} \
        -e APT_CACHE_SERVER=${APT_PROXY%:*} \
        -e PIMELEON_UI_BUILD_TOKEN=${PIMELEON_UI_BUILD_TOKEN} \
        $BUILD_IMAGE)
      # Copy scripts into container
      docker cp shared/scripts/. $CONTAINER_ID:/scripts/
      # Start container and wait for completion
      docker start -a $CONTAINER_ID
      # Cleanup
      docker rm $CONTAINER_ID || true
    - echo "Build output:"
    - ls -la output/ || true
    - sudo chown -R "$(id -u):$(id -g)" output/ || true
  artifacts:
    paths:
      - output/*.img
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.log
      - output/pi-initial-password.txt
    expire_in: 1 week

# ============================================
# TEST STAGE
# ============================================

test:smoke:
  extends: .docker-job
  stage: test
  needs: ["build:pimeleon"]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: never
    - when: on_success
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=smoke \
        $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

test:integration:
  extends: .docker-job
  stage: test
  needs: ["build:pimeleon"]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: never
    - when: on_success
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=integration \
        $TEST_IMAGE
  timeout: 30 minutes
  allow_failure: true

# ============================================
# PUBLISH STAGE
# ============================================

publish:image:
  stage: publish
  tags:
    - lightweight
  needs: ["build:pimeleon", "test:smoke"]
  rules:
    # Publish on platform release branches
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi[34]-/'
    - if: '$CI_COMMIT_TAG'
  script:
    - cd output
    - |
      for file in pimeleon-*.img.xz pimeleon-*.tar.gz; do
        if [ -f "$file" ]; then
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
               --upload-file "$file" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pimeleon/${CI_COMMIT_TAG:-latest}/$(basename $file)"
        fi
      done

publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs: ["test:smoke"]
  rules:
    # Publish docs from develop or release branches
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi[34]-/'
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public

# ============================================
# RELEASE STAGE (automatic versioning)
# ============================================
# Tags created only on platform release branches
# - Merge from develop: full semver (feat=minor, fix=patch, breaking=major)
# - Direct hotfix: patch-only mode

# Platform-specific release: RPi 3B+ Bookworm
release:rpi3-bookworm:
  stage: release
  image: registry.gitlab.com/juhani/go-semrel-gitlab:v0.21.1
  tags:
    - lightweight
  cache: {}
  needs:
    - job: build:pimeleon
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "release/rpi3-bookworm"'
      when: on_success
    - when: never
  variables:
    GIT_SSL_NO_VERIFY: "1"
    GITLAB_URL: "https://192.168.76.5:8443/api/v4"
    GSG_TOKEN: $GITLAB_TOKEN
    GSG_RELEASE_BRANCHES: "release/rpi3-bookworm"
  script:
    - echo "Calculating next version for RPi 3B+ Bookworm..."
    - |
      # Detect if this is a merge from develop
      IS_MERGE_FROM_DEVELOP=false
      if git log -1 --format=%s | grep -qE "^Merge branch 'develop'"; then
        IS_MERGE_FROM_DEVELOP=true
        echo "Detected merge from develop - full semver rules apply"
      else
        echo "Direct commit (hotfix) - patch-only mode"
      fi
    - |
      # Calculate next version based on merge type
      if [ "$IS_MERGE_FROM_DEVELOP" = "true" ]; then
        # Full semver: feat=minor, fix=patch, breaking=major
        NEXT_VERSION=$(release --skip-ssl-verify next-version --allow-current)
      else
        # Hotfix mode: force patch increment only
        CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$CURRENT_TAG" ]; then
          NEXT_VERSION="0.0.1-rpi3-bookworm"
        else
          # Extract version parts and increment patch
          BASE=$(echo "$CURRENT_TAG" | sed 's/^v//' | sed 's/-rpi3-bookworm$//')
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-rpi3-bookworm"
        fi
      fi
    - echo "Next version - ${NEXT_VERSION}"
    - |
      if [ -n "$NEXT_VERSION" ]; then
        echo "Creating tag v${NEXT_VERSION}..."
        if ! release --skip-ssl-verify tag 2>&1 | tee /tmp/release.log; then
          if grep -q "no changes found" /tmp/release.log; then
            echo "No releasable changes - skipping tag"
          else
            cat /tmp/release.log
            exit 1
          fi
        fi
      else
        echo "No version bump needed"
      fi

