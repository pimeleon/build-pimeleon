---
# GitLab CI/CD Pipeline - Global Configuration
# Stages, Variables, Defaults, and Workflow Rules

stages:
  - .pre
  - scan
  - lint
  - build
  - test
  - publish
  - release
  - docs
  - .post

variables:
  DOCKER_BUILDKIT: 1
  # Default to develop images for feature branches
  BUILD_IMAGE_NAME: builder
  BUILD_IMAGE_TAG: develop
  TEST_IMAGE_NAME: tester
  TEST_IMAGE_TAG: develop
  GIT_DEPTH: 0

# Override template for production-bound pipelines
.release-images:
  variables:
    BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}

# Global defaults for all jobs
default:
  tags:
    - linux
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  interruptible: true

# Workflow rules - smart pipeline triggering
workflow:
  rules:
    # Full pipeline on release branches (one branch per platform)
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: always
    # Full pipeline on version tags (production release, tag format: {platform}-v{version})
    - if: '$CI_COMMIT_TAG'
      when: always
    # Lint + scan + dev build on develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    # MR events targeting develop or release branches
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: always
    # Lint + scan on conventional commit feature branches
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|fix|chore|refactor|docs|test|style|perf|ci|build)\//'
      when: always
    # Manual pipeline dispatch
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    # Skip for all other cases
    - when: never
