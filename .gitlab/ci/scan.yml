---
# GitLab CI/CD - Security Scanning
# Trivy and Gitleaks

security:trivy:
  stage: scan
  image:
    name: aquasec/trivy:0.69.1
    entrypoint: [""]
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
    policy: pull-push
  variables:
    TRIVY_CACHE_DIR: .trivy-cache
  script:
    - chmod +x .gitlab/scripts/scan-trivy.sh
    - .gitlab/scripts/scan-trivy.sh
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 1 week

security:gitleaks:
  stage: scan
  image:
    name: ghcr.io/gitleaks/gitleaks:latest
    entrypoint: [""]
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: on_success
  script:
    - chmod +x .gitlab/scripts/scan-gitleaks.sh
    - .gitlab/scripts/scan-gitleaks.sh
