---
# GitLab CI/CD - Testing
# Smoke and Integration Tests
#
# TARGET_PLATFORM is injected from setup:platform via dotenv artifact.
# Jobs run on release/* branch pushes and on MRs targeting release/* branches.

# Smoke test — quick sanity check of the built image
test:smoke:
  extends: .docker-job
  stage: test-images
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    TEST_SUITE: smoke
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
    - job: build:containers
      optional: true
  rules:
    # Production: tags
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: push/merge to release/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/run-tests.sh
    - .gitlab/scripts/run-tests.sh
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# Integration test — full end-to-end verification (production)
test:integration:
  extends: .docker-job
  stage: test-images
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    TEST_SUITE: integration
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
    - job: build:containers
      optional: true
  rules:
    # Production: tags
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: push/merge to release/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: latest
    # Production: manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/run-tests.sh
    - .gitlab/scripts/run-tests.sh
  timeout: 30 minutes
