---
# GitLab CI/CD - Testing
# Smoke and Integration Tests
#
# TARGET_PLATFORM is injected from setup:platform via dotenv artifact.
# Jobs run on release/* branch pushes and on MRs targeting release/* branches.

# Smoke test — quick sanity check of the built image
test:smoke:
  extends: .docker-job
  stage: test
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
  rules:
    # Production: tags
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: push/merge to release/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=smoke \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# Integration test — full end-to-end verification (production)
test:integration:
  extends: .docker-job
  stage: test
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
  rules:
    # Production: tags
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: push/merge to release/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Production: manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=integration \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        $TEST_IMAGE
  timeout: 30 minutes
