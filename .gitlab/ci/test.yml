---
# GitLab CI/CD - Testing
# Smoke and Integration Tests
#
# TARGET_PLATFORM is injected from setup:platform via dotenv artifact.
# Jobs run on release/* branch pushes and on MRs targeting release/* branches.
# Both use tester:latest — branch-specific images are not guaranteed to exist.

# Smoke test — quick sanity check of the built image
test:smoke:
  extends: .docker-job
  stage: test
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: provide:artifacts
  rules:
    # 1. ALWAYS run if version is NEW (not in registry)
    - if: '$IMAGE_EXISTS == "false"'
      when: on_success

    # 2. Run if version is OLD but SOURCES changed (fix on same version)
    - if: '$IMAGE_EXISTS == "true"'
      changes:
        - apps/**/*
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/scripts/**/*
        - scripts/**/*
        - Makefile
        - docker-compose.yml
        - requirements.txt
        - .env.defaults
      when: on_success

    # 3. SKIP tests if version exists and NO sources changed (CI/Docs only)
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=smoke \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        $TEST_IMAGE
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit: test-results/junit.xml
    expire_in: 1 week

# Integration test — full end-to-end verification
test:integration:
  extends: .docker-job
  stage: test
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: provide:artifacts
  rules:
    # 1. ALWAYS run if version is NEW (not in registry)
    - if: '$IMAGE_EXISTS == "false"'
      when: on_success

    # 2. Run if version is OLD but SOURCES changed (fix on same version)
    - if: '$IMAGE_EXISTS == "true"'
      changes:
        - apps/**/*
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/scripts/**/*
        - scripts/**/*
        - Makefile
        - docker-compose.yml
        - requirements.txt
        - .env.defaults
      when: on_success

    # 3. SKIP tests if version exists and NO sources changed (CI/Docs only)
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
    - if: '$CI_COMMIT_TAG'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:latest
  script:
    - mkdir -p test-results
    - |
      docker run --rm \
        --privileged \
        -v $CI_PROJECT_DIR/output:/images:ro \
        -v $CI_PROJECT_DIR/tests:/tests \
        -v $CI_PROJECT_DIR/test-results:/results \
        -e TEST_SUITE=integration \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        $TEST_IMAGE
  timeout: 30 minutes
