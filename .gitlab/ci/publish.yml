---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Dry-run R2 validation (actual upload delegated to GitHub Actions)
deploy:r2-dryrun:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  environment:
    name: cicd/production
  script:
    - chmod +x .gitlab/scripts/deploy-r2.sh
    - .gitlab/scripts/deploy-r2.sh
