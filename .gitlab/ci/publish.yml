---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Upload platform image to the Generic Packages registry.
# Version is computed from conventional commits using apps/{platform}/VERSION as baseline.
publish:image:
  stage: publish
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: test:smoke
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
  script:
    - |
      SCRIPTS_DIR="./shared/scripts"
      [ ! -f "./scripts/build.sh" ] || SCRIPTS_DIR="./scripts"
      chmod +x "${SCRIPTS_DIR}/get-next-version.sh"
      VERSION=$("${SCRIPTS_DIR}/get-next-version.sh" "${TARGET_PLATFORM}")
      echo "Publishing version ${VERSION} for ${TARGET_PLATFORM}"
      cd output
      for file in pimeleon-*.img.xz pimeleon-*.tar.gz; do
        if [ -f "$file" ]; then
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$file" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pimeleon/${TARGET_PLATFORM}-v${VERSION}/$(basename $file)"
        fi
      done

# Build MkDocs site and publish to GitLab Pages (release branches only)
publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: test:smoke
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install "mkdocs>=1.5.3,<2.0" mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public

# Documentation preview for project builds (artifact-based)
publish-project-docs:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs: ["lint:yaml"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - docs/**/*
        - mkdocs.yml
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
    expire_in: 1 week
