---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

publish:image:
  stage: publish
  tags:
    - lightweight
  needs: ["build:pimeleon", "test:smoke"]
  rules:
    # Publish on platform release branches
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi[34]-/'
    - if: '$CI_COMMIT_TAG'
  script:
    - cd output
    - |
      for file in pimeleon-*.img.xz pimeleon-*.tar.gz; do
        if [ -f "$file" ]; then
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$file" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pimeleon/${CI_COMMIT_TAG:-latest}/$(basename $file)"
        fi
      done

publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs: ["build:pimeleon", "test:smoke"]
  rules:
    # Publish docs from develop or release branches
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/rpi[34]-/'
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public

# Documentation preview for Merge Requests (artifact-based, no review environment)
publish:docs-preview:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs: ["build:pimeleon", "test:smoke"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
    expire_in: 1 week
