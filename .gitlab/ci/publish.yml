---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Upload platform image artifacts to the GitLab Generic Packages registry.
# Runs on direct push and MR merges targeting release/* branches.
publish:image:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  environment:
    name: production
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
      optional: true
    - job: test:smoke
      optional: true
    - job: test:integration
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache curl git
  script:
    - chmod +x .gitlab/scripts/publish-image.sh
    - .gitlab/scripts/publish-image.sh
  artifacts:
    reports:
      dotenv: publish.env
    paths:
      - output/*.img.xz
      - output/*.sha256
    expire_in: 1 week

# Run upload to Cloudflare R2
deploy:r2:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
      optional: true
    - job: publish:image
      artifacts: false
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  variables:
    AWS_ACCESS_KEY_ID: $S3_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $S3_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: auto
  environment:
    name: production
  before_script:
    - apk add --no-cache curl git
  script:
    - chmod +x .gitlab/scripts/deploy-r2.sh
    - .gitlab/scripts/deploy-r2.sh
