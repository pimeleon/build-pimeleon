---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Upload platform image to the Generic Packages registry.
# Version is computed from conventional commits using apps/{platform}/VERSION as baseline.
# Only runs on production pipelines (release/* branches and version tags).
publish:image:
  stage: publish
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: provide:artifacts
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    # 1. ALWAYS publish if version is NEW (not in registry)
    - if: '$IMAGE_EXISTS == "false"'
      when: on_success

    # 2. Publish if version is OLD but SOURCES changed (re-publish fix)
    - if: '$IMAGE_EXISTS == "true"'
      changes:
        - apps/**/*
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/scripts/**/*
        - scripts/**/*
        - Makefile
        - docker-compose.yml
        - requirements.txt
        - .env.defaults
      when: on_success

    # 3. SKIP publish if version exists and NO sources changed
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
  environment:
    name: production
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/publish-image.sh
    - .gitlab/scripts/publish-image.sh

# Dry-run R2 validation (actual upload delegated to GitHub Actions)
deploy:r2-dryrun:
  stage: publish
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: provide:artifacts
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    # 1. ALWAYS dry-run if version is NEW (not in registry)
    - if: '$IMAGE_EXISTS == "false"'
      when: on_success

    # 2. Dry-run if version is OLD but SOURCES changed (fix on same version)
    - if: '$IMAGE_EXISTS == "true"'
      changes:
        - apps/**/*
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/scripts/**/*
        - scripts/**/*
        - Makefile
        - docker-compose.yml
        - requirements.txt
        - .env.defaults
      when: on_success

    # 3. SKIP dry-run if version exists and NO sources changed
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  environment:
    name: production
  script:
    - chmod +x .gitlab/scripts/deploy-r2.sh
    - .gitlab/scripts/deploy-r2.sh

# Build MkDocs site and publish to GitLab Pages (release branches and version tags)
publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - chmod +x .gitlab/scripts/setup-apt-proxy.sh
    - .gitlab/scripts/setup-apt-proxy.sh
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install "mkdocs>=1.5.3,<2.0" mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
