---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Upload platform image to the Generic Packages registry.
# Version is computed from conventional commits using apps/{platform}/VERSION as baseline.
# Only runs on production pipelines (release/* branches and version tags).
publish:image:
  stage: publish
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: upload:artifacts
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
  environment:
    name: production
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/publish-image.sh
    - .gitlab/scripts/publish-image.sh

# Deploy compressed image to Cloudflare R2 (production releases only, not MR pipelines)
deploy:r2:
  stage: publish
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: upload:artifacts
      artifacts: true
    - job: test:smoke
      artifacts: false
  rules:
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never
  environment:
    name: production
  variables:
    AWS_ACCESS_KEY_ID: $S3_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $S3_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: auto
  script:
    - chmod +x .gitlab/scripts/deploy-r2.sh
    - .gitlab/scripts/deploy-r2.sh

# Build MkDocs site and publish to GitLab Pages (release branches and version tags)
publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - chmod +x .gitlab/scripts/setup-apt-proxy.sh
    - .gitlab/scripts/setup-apt-proxy.sh
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install "mkdocs>=1.5.3,<2.0" mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
