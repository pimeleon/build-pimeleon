---
# GitLab CI/CD - Publishing
# Image registry, GitLab Pages, and Documentation Previews

# Upload platform image to the Generic Packages registry.
# Version is computed from conventional commits using apps/{platform}/VERSION as baseline.
publish:image:
  stage: publish
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
    - job: test:smoke
      artifacts: false
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      SCRIPTS_DIR="./shared/scripts"
      [ ! -f "./scripts/build.sh" ] || SCRIPTS_DIR="./scripts"
      chmod +x "${SCRIPTS_DIR}/get-next-version.sh"
      VERSION=$("${SCRIPTS_DIR}/get-next-version.sh" "${TARGET_PLATFORM}")
      echo "Publishing version ${VERSION} for ${TARGET_PLATFORM}"
      cd output
      for file in pimeleon-*.img.xz pimeleon-*.tar.gz; do
        if [ -f "$file" ]; then
          curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            --upload-file "$file" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/pimeleon/${TARGET_PLATFORM}-v${VERSION}/$(basename $file)"
        fi
      done

# Deploy compressed image to Cloudflare R2 (production releases only, not MR pipelines)
deploy:r2:
  stage: publish
  image: amazon/aws-cli
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
    - job: test:smoke
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - when: never
  variables:
    AWS_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $R2_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: auto
  script:
    - |
      SCRIPTS_DIR="./shared/scripts"
      [ ! -f "./scripts/build.sh" ] || SCRIPTS_DIR="./scripts"
      chmod +x "${SCRIPTS_DIR}/get-next-version.sh"
      VERSION=$("${SCRIPTS_DIR}/get-next-version.sh" "${TARGET_PLATFORM}")
      UPLOAD_PREFIX="${TARGET_PLATFORM}/v${VERSION}"
      echo "Deploying to R2: s3://${R2_BUCKET}/${UPLOAD_PREFIX}/"
      cd output
      for file in pimeleon-*.img.xz pimeleon-*.img.metadata.json; do
        [ -f "$file" ] || continue
        echo "Uploading $file..."
        aws s3 cp "$file" "s3://${R2_BUCKET}/${UPLOAD_PREFIX}/$(basename $file)" \
          --endpoint-url "${R2_ENDPOINT}" \
          --no-progress
      done

# Build MkDocs site and publish to GitLab Pages (release branches only)
publish:pages:
  stage: publish
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: test:smoke
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
  before_script:
    - echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
