---
# GitLab CI/CD Templates
# Reusable job definitions

# Docker job template with registry authentication
# Runner has host docker socket mounted, no dind needed
# Uses CI_REGISTRY_PASSWORD for read-write access (CI_JOB_TOKEN is read-only)
.docker-job:
  image: docker:latest
  variables:
    # BuildKit for faster builds with cache reuse
    DOCKER_BUILDKIT: "1"
    BUILD_IMAGE: ${CI_REGISTRY_IMAGE}/builder:${BUILD_IMAGE_TAG}
    TEST_IMAGE: ${CI_REGISTRY_IMAGE}/tester:${TEST_IMAGE_TAG}
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  tags:
    - containers
