---
# GitLab CI/CD - Docs Triggers
# External documentation site triggers

# Build MkDocs site and provide artifact preview (internal to project)
publish-project-docs:
  stage: docs
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: "publish:image"
      optional: true

  rules:
    # Run on release branch push (merge to release/*)
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    # Run on MRs targeting release/* or develop to verify documentation
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
  before_script:
    - chmod +x .gitlab/scripts/setup-apt-proxy.sh
    - .gitlab/scripts/setup-apt-proxy.sh
  script:
    - chmod +x .gitlab/scripts/build-docs.sh
    - .gitlab/scripts/build-docs.sh
  artifacts:
    paths:
      - public
    expire_in: 1 week

# Trigger preview site build on downstream repository
trigger-docs-preview:
  stage: docs
  needs:
    - job: "publish:image"
      optional: true
  trigger:
    project: pirouter/pimeleon-site
    branch: preview
  variables:
    TRIGGERED_BY: pimeleon-build
    SOURCE_BRANCH: $CI_COMMIT_BRANCH
    SOURCE_COMMIT: $CI_COMMIT_SHA
  environment:
    name: documentation/preview
    url: https://preview.pimeleon-docs.pages.dev
  rules:
    # Trigger on MRs targeting release/* or develop for preview
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop)$/'
      when: always
    - when: never

# Trigger production site build on downstream repository
trigger-docs-production:
  stage: docs
  needs:
    - job: "lint:yaml"
    - job: "trigger:github"
      optional: true
    - job: "publish:image"
      optional: true
    - job: "test:smoke"
      optional: true
    - job: "test:integration"
      optional: true
  trigger:
    project: pirouter/pimeleon-site
    branch: master
  variables:
    TRIGGERED_BY: pimeleon-build
    SOURCE_BRANCH: $CI_COMMIT_BRANCH
    SOURCE_COMMIT: $CI_COMMIT_SHA
  environment:
    name: documentation/production
    url: https://pimeleon.org
  rules:
    # Trigger on any release branch push (merge to release/*)
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
