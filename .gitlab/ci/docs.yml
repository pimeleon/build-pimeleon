---
# GitLab CI/CD - Docs Triggers
# External documentation site triggers

# Build MkDocs site and provide artifact preview (internal to project)
publish-project-docs:
  stage: docs
  image: python:3.11-slim
  tags:
    - lightweight
  needs:
    - job: "lint:yaml"
    - job: "build:pimeleon"
      optional: true
    - job: "test:smoke"
      optional: true
    - job: "test:integration"
      optional: true

  rules:
    # Run on release branch push (merge to release/*)
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      changes:
        - docs/**/*
        - mkdocs.yml
  before_script:
    - |
      echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
      echo 'Acquire::http::Pipeline-Depth "0";' >> /etc/apt/apt.conf.d/80-retries
      echo 'Acquire::http::Timeout "60";' >> /etc/apt/apt.conf.d/80-retries
      echo "Acquire::http::Proxy \"http://${APT_PROXY}\";" > /etc/apt/apt.conf.d/01proxy
      echo 'Acquire::https::Proxy "DIRECT";' >> /etc/apt/apt.conf.d/01proxy
  script:
    - apt-get -qy update && apt-get -q install -y --no-install-recommends git
    - pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
    expire_in: 1 week

# Trigger preview site build on downstream repository
trigger-docs-preview:
  stage: docs
  needs:
    - job: "lint:yaml"
    - job: "build:pimeleon"
      optional: true
    - job: "test:smoke"
      optional: true
    - job: "test:integration"
      optional: true
  trigger:
    project: pirouter/pimeleon-site
    branch: preview
  variables:
    TRIGGERED_BY: pimeleon-build
    SOURCE_BRANCH: $CI_COMMIT_BRANCH
    SOURCE_COMMIT: $CI_COMMIT_SHA
  environment:
    name: documentation/preview
    url: https://preview.pimeleon-docs.pages.dev
  rules:
    # Trigger on direct push to develop or MRs targeting develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"'
      changes:
        - docs/**/*
        - mkdocs.yml

# Trigger production site build on downstream repository
trigger-docs-production:
  stage: docs
  needs:
    - job: "lint:yaml"
    - job: "build:pimeleon"
      optional: true
    - job: "test:smoke"
      optional: true
    - job: "test:integration"
      optional: true
  trigger:
    project: pirouter/pimeleon-site
    branch: main
  variables:
    TRIGGERED_BY: pimeleon-build
    SOURCE_BRANCH: $CI_COMMIT_BRANCH
    SOURCE_COMMIT: $CI_COMMIT_SHA
  environment:
    name: documentation/production
    url: https://pimeleon.org
  rules:
    # Trigger on any release branch push (merge to release/*)
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - docs/**/*
        - mkdocs.yml
