---
# GitLab CI/CD - Release
# Creates GitLab Releases on version tags and pushes to GitHub.

# Create a GitLab Release tied to the version tag
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: publish:image
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
  environment:
    name: production
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG} (${TARGET_PLATFORM})"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Pimeleon ${TARGET_PLATFORM} ${CI_COMMIT_TAG}"
    description: |
      Pimeleon image release for **${TARGET_PLATFORM}**.

      Built from commit ${CI_COMMIT_SHORT_SHA} on branch ${CI_COMMIT_REF_NAME}.

      Download the image from the [Generic Packages registry](${CI_PROJECT_URL}/-/packages).

# Trigger GitHub Actions to deploy the release to Cloudflare R2
trigger:github:
  stage: release
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/trigger-github.sh
    - .gitlab/scripts/trigger-github.sh
