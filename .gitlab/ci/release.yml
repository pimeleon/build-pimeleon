---
# GitLab CI/CD - Release
# Automated tag creation for production builds.
# GitHub Actions is responsible for creating GitHub Releases and release tags.

# Create annotated production tag after image is published via MR pipeline.
# Tag format: {platform}-v{version}-{short_sha}  e.g. rpi3-bookworm-v0.4.2-abc1234
tag:production:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: publish:image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/create-tag.sh
    - .gitlab/scripts/create-tag.sh
        "${TARGET_PLATFORM}-v${PUBLISHED_VERSION}-${CI_COMMIT_SHORT_SHA}"
        "Production build ${TARGET_PLATFORM} v${PUBLISHED_VERSION}"

# Trigger GitHub Actions to build and publish the GitHub Release.
# GitHub creates release-{platform}-v{version} tag and GitHub Release body.
trigger:github:
  stage: release
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      optional: true
      artifacts: false
    - job: test:smoke
      optional: true
      artifacts: false
    - job: test:integration
      optional: true
      artifacts: false
    - job: publish:image
      optional: true
      artifacts: false
    - job: deploy:r2
      optional: true
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
    - when: never
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/trigger-github.sh
    - .gitlab/scripts/trigger-github.sh
