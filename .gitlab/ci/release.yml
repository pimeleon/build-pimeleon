---
# GitLab CI/CD - Release
# Creates GitLab Releases on version tags.
# Tag format: {platform}-v{version}, e.g., rpi4-bookworm-v1.2.3

# Create a GitLab Release tied to the version tag
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - lightweight
  needs: []
  rules:
    - if: '$CI_COMMIT_TAG'
  environment:
    name: cicd/production
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG} (${TARGET_PLATFORM})"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Pimeleon ${TARGET_PLATFORM} ${CI_COMMIT_TAG}"
    description: |
      Pimeleon image release for **${TARGET_PLATFORM}**.

      Built from commit ${CI_COMMIT_SHORT_SHA} on branch ${CI_COMMIT_REF_NAME}.

      Download the image from the [Generic Packages registry](${CI_PROJECT_URL}/-/packages).
