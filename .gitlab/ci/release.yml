---
# GitLab CI/CD - Release
# Creates GitLab Releases on version tags.
# Tag format: {platform}-v{version}, e.g., rpi4-bookworm-v1.2.3

# Create a GitLab Release tied to the version tag
release:create:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: publish:image
  rules:
    - when: never
  environment:
    name: production
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG} (${TARGET_PLATFORM})"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Pimeleon ${TARGET_PLATFORM} ${CI_COMMIT_TAG}"
    description: |
      Pimeleon image release for **${TARGET_PLATFORM}**.

      Built from commit ${CI_COMMIT_SHORT_SHA} on branch ${CI_COMMIT_REF_NAME}.

      Download the image from the [Generic Packages registry](${CI_PROJECT_URL}/-/packages).

# Trigger GitHub Actions to deploy the release to Cloudflare R2
trigger:github:
  stage: release
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      optional: true
      artifacts: false
    - job: test:smoke
      optional: true
      artifacts: false
    - job: test:integration
      optional: true
      artifacts: false
    - job: publish:image
      optional: true
      artifacts: false
    - job: deploy:r2
      optional: true
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/trigger-github.sh
    - .gitlab/scripts/trigger-github.sh
