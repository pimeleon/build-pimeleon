---
# GitLab CI/CD - Release
# Automated tag creation for production builds and official releases.
# GitHub Actions is responsible for creating GitHub Releases.

# Skip-cascade via non-optional needs:
#   tag:production → publish:gitlab-image → build:pimeleon  (MR pipeline)
#   tag:release       → trigger:github                     (release branch push)

# Create annotated production tag after image is published via MR pipeline.
# Runs when a release-bound MR builds and publishes a new image version.
# Tag format: {platform}-v{version}  e.g. rpi3-bookworm-v0.4.2
tag:production:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: publish:gitlab-image
      artifacts: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - chmod +x .gitlab/scripts/create-tag.sh
    - .gitlab/scripts/create-tag.sh
        "${TARGET_PLATFORM}-v${PIMELEON_VERSION}"
        "Production build ${TARGET_PLATFORM} v${PIMELEON_VERSION}"

# Poll GitHub Releases until the triggered build is published, then create
# an annotated release tag.
# Tag format: release-{platform}-v{version}  e.g. release-rpi3-bookworm-v0.4.2
tag:release:
  stage: release
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: trigger:github
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache git curl jq
  script:
    - chmod +x .gitlab/scripts/tag-release.sh .gitlab/scripts/create-tag.sh
    - .gitlab/scripts/tag-release.sh
  timeout: 20 minutes

# Trigger GitHub Actions to build and publish the GitHub Release.
trigger:github:
  stage: release
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      optional: true
      artifacts: false
    - job: test:smoke
      optional: true
      artifacts: false
    - job: test:integration
      optional: true
      artifacts: false
    - job: publish:image
      optional: true
      artifacts: false
    - job: deploy:r2
      optional: true
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/trigger-github.sh
    - .gitlab/scripts/trigger-github.sh
