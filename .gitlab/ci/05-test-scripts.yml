---
# GitLab CI/CD - Testing shell scripts

test:scripts:
  stage: test-scripts
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    # Run on direct push or merge to develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    # Run on MRs targeting develop or release branches
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: always
    # Run on release branches and tags
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    # Manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bats git
    - pip install --quiet pyyaml
  script:
    - mkdir -p test-results
    - bash scripts/run-script-tests.sh
  artifacts:
    when: always
    reports:
      junit: test-results/report.xml
    paths:
      - test-results/
    expire_in: 1 week
