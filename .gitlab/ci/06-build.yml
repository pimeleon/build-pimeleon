---
# GitLab CI/CD - Build
# Containers and Pimeleon Image


# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    # Rebuild if dependencies changed
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml

    - when: never
  script:
    - chmod +x .gitlab/scripts/build-containers.sh
    - .gitlab/scripts/build-containers.sh
# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:containers
      optional: true
    - job: lint:yaml
      optional: true
    - job: lint:ansible
      optional: true
    - job: lint:shell
      optional: true
    - job: test:scripts
      optional: true
    - job: security:trivy
      optional: true
    - job: security:gitleaks
      optional: true
  tags:
    - heavy
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - chmod +x .gitlab/scripts/build-image.sh .gitlab/scripts/resolve-version.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    when: always
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week

# Platform build — triggered by push to release/* branches, version tags, and release-bound MRs
build:pimeleon:
  extends: .build-pimeleon
  rules:
    # Tag — production build from GitHub releases
    - if: '$CI_COMMIT_TAG'
      variables:
        PIMELEON_APPS_SOURCE: gitlab
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Push/merge to release/* — production build from GitHub releases (only if not an MR pipeline)
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
      variables:
        PIMELEON_APPS_SOURCE: gitlab
        BUILD_IMAGE_TAG: latest
        TEST_IMAGE_TAG: latest
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: never
    # MR targeting release/* — only rebuild when image-relevant files changed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        PIMELEON_APPS_SOURCE: gitlab
        BUILD_IMAGE_TAG: latest
        TEST_IMAGE_TAG: latest
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      when: never

    # Default: skip
    - when: never
