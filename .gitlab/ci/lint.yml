---
# GitLab CI/CD - Linting
# YAML, Ansible, and Shell

lint:yaml:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: never
    - when: on_success
  before_script:
    - pip install --quiet yamllint
  script:
    - yamllint -c .yamllint .

lint:ansible:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: never
    - when: on_success
  before_script:
    - pip install --quiet ansible-lint
    - ansible-galaxy collection install -r shared/ansible/requirements.yml
  script:
    - cd shared/ansible
    - ansible-lint playbooks/*.yml

lint:shell:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: never
    - when: on_success
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck jq &>/dev/null
    - pip install --quiet semgrep
  script:
    - bash scripts/quality-benchmark.sh

test:scripts:
  stage: test-scripts
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    # Run on direct push or merge to develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    # Run on MRs targeting develop or release branches
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: always
    # Run on release branches and tags
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    # Manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends bats git &>/dev/null
    - pip install --quiet pyyaml
  script:
    - mkdir -p test-results
    - bash scripts/run-script-tests.sh
  artifacts:
    when: always
    reports:
      junit: test-results/report.xml
    paths:
      - test-results/
    expire_in: 1 week
