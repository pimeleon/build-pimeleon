---
# GitLab CI/CD - Linting
# YAML, Ansible, and Shell

lint:yaml:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  script:
    - chmod +x .gitlab/scripts/lint-yaml.sh
    - .gitlab/scripts/lint-yaml.sh

lint:ansible:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  script:
    - chmod +x .gitlab/scripts/lint-ansible.sh
    - .gitlab/scripts/lint-ansible.sh

lint:shell:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  needs: []
  script:
    - chmod +x .gitlab/scripts/lint-shell.sh
    - .gitlab/scripts/lint-shell.sh

test:scripts:
  stage: test-scripts
  image: python:3.11-slim
  tags:
    - python
  needs: []
  rules:
    # Run on direct push or merge to develop
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: always
    # Run on MRs targeting develop or release branches
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
      when: always
    # Run on release branches and tags
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    # Manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
  script:
    - chmod +x .gitlab/scripts/test-scripts.sh
    - .gitlab/scripts/test-scripts.sh
  artifacts:
    when: always
    reports:
      junit: test-results/report.xml
    paths:
      - test-results/
    expire_in: 1 week
