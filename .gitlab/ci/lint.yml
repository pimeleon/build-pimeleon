---
# GitLab CI/CD - Linting
# YAML, Ansible, and Shell

lint:yaml:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  before_script:
    - pip install --quiet yamllint
  script:
    - yamllint -c .yamllint .

lint:ansible:
  stage: lint
  image: python:3.11-slim
  tags:
    - python
  before_script:
    - pip install --quiet ansible-lint
    - ansible-galaxy collection install -r shared/ansible/requirements.yml
  script:
    - cd shared/ansible
    - ansible-lint playbooks/*.yml

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  tags:
    - linux
  script:
    - find . -name "*.sh" -type f
        -not -path "./cache/*"
        -not -path "./.venv/*"
        -not -path "*/node_modules/*"
        -not -path "*/files/services/pihole/*"
      | xargs shellcheck
