---
# GitLab CI/CD - Build
# Cache warming, Containers, and Pimeleon Image

# Detect platform from release branch name and export as dotenv artifact.
# Downstream jobs use TARGET_PLATFORM via: needs: [job: setup:platform, artifacts: true]
setup:platform:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.*)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tag format: {platform}-v{version}, e.g., rpi4-bookworm-v1.2.3
        PLATFORM=$(echo "$CI_COMMIT_TAG" | sed 's/-v[0-9].*//')
        PROFILE="production"
      elif [ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]; then
        # MRs always use development profile to avoid slow source builds
        if [[ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" =~ ^release/ ]]; then
          PLATFORM=$(echo "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" | sed 's|^release/||')
        else
          PLATFORM="rpi3-bookworm"
        fi
        PROFILE="development"
      elif [ "$CI_PIPELINE_SOURCE" == "web" ]; then
        PLATFORM="${TARGET_PLATFORM:-rpi3-bookworm}"
        PROFILE="${PIMELEON_PROFILE:-production}"
      else
        if [[ "$CI_COMMIT_BRANCH" =~ ^release/ ]]; then
          PLATFORM=$(echo "$CI_COMMIT_BRANCH" | sed 's|^release/||')
          PROFILE="production"
        else
          # Direct push to develop or other branch
          PLATFORM="rpi3-bookworm"
          PROFILE="development"
        fi
      fi
      echo "TARGET_PLATFORM=$PLATFORM" > platform.env
      echo "PIMELEON_PROFILE=$PROFILE" >> platform.env
      echo "Platform detected: $PLATFORM"
      echo "Profile selected: $PROFILE"
  artifacts:
    reports:
      dotenv: platform.env

# Pull (or seed) the base image cache for the detected platform
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.*)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - mkdir -p cache
    - |
      CACHE_FILE="cache/pimeleon-${TARGET_PLATFORM}-base.tar.gz"
      if [ -f "$CACHE_FILE" ]; then
        echo "Cache found: $CACHE_FILE"
        ls -lh "$CACHE_FILE"
      else
        echo "Cache not found, will be created by build:pimeleon"
      fi

# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.*)$/'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - |
      # Prioritize local Dockerfiles if they exist in the branch root
      BUILDER_DF="./containers/builder/Dockerfile"
      TESTER_DF="./containers/tester/Dockerfile"
      [ -f "$BUILDER_DF" ] || BUILDER_DF="./shared/containers/builder/Dockerfile"
      [ -f "$TESTER_DF" ] || TESTER_DF="./shared/containers/tester/Dockerfile"

      echo "Using builder Dockerfile: ${BUILDER_DF}"
      echo "Using tester Dockerfile: ${TESTER_DF}"

      docker build --cache-from ${CI_REGISTRY_IMAGE}/builder:latest --build-arg APT_CACHE_SERVER=${APT_PROXY%:*} -t $BUILD_IMAGE -t ${CI_REGISTRY_IMAGE}/builder:latest -f "$BUILDER_DF" .
      docker build --cache-from ${CI_REGISTRY_IMAGE}/tester:latest --build-arg APT_CACHE_SERVER=${APT_PROXY%:*} -t $TEST_IMAGE -t ${CI_REGISTRY_IMAGE}/tester:latest -f "$TESTER_DF" "$(dirname "$TESTER_DF")"
    - docker push $BUILD_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/builder:latest
    - docker push $TEST_IMAGE
    - docker push ${CI_REGISTRY_IMAGE}/tester:latest

# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
  tags:
    - heavy
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull
  script:
    - set -e
    - 'echo "Building Pimeleon image for ${TARGET_PLATFORM} (Profile: ${PIMELEON_PROFILE})..."'
    - mkdir -p output cache
    - |
      # Compute mount paths - prioritize shared as baseline, allow branch-local overrides
      # if they contain the expected entry points.
      ANSIBLE_DIR="./shared/ansible"
      CONFIGS_DIR="./shared/configs"
      SCRIPTS_DIR="./shared/scripts"

      [ ! -f "./ansible/playbooks/main.yml" ] || ANSIBLE_DIR="./ansible"
      [ ! -d "./configs/network" ] || CONFIGS_DIR="./configs"
      [ ! -f "./scripts/build.sh" ] || SCRIPTS_DIR="./scripts"

      echo "Using ansible from: ${ANSIBLE_DIR}"
      echo "Using configs from: ${CONFIGS_DIR}"
      echo "Using scripts from: ${SCRIPTS_DIR}"

      # Use the detected scripts directory for versioning as well
      chmod +x "${SCRIPTS_DIR}/get-next-version.sh"
      BASE_VERSION=$("${SCRIPTS_DIR}/get-next-version.sh" "${TARGET_PLATFORM}")
      PIMELEON_VERSION="${BASE_VERSION}-${CI_COMMIT_SHORT_SHA}"
      echo "Building version: ${PIMELEON_VERSION}"
    - |
      CONTAINER_ID=$(docker create \
        --privileged \
        -v /dev:/dev:rw \
        -v "$CI_PROJECT_DIR/cache":/cache \
        -e CI=true \
        -e WORKSPACE_DIR=/workspace \
        -e CACHE_DIR=/cache \
        -e OUTPUT_DIR=/output \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        -e PIMELEON_VERSION="${PIMELEON_VERSION}" \
        -e PIMELEON_PROFILE="${PIMELEON_PROFILE}" \
        -e APT_CACHE_SERVER="${APT_PROXY%:*}" \
        -e PIMELEON_UI_BUILD_TOKEN="${PIMELEON_UI_BUILD_TOKEN}" \
        "$BUILD_IMAGE")
      docker cp "${SCRIPTS_DIR}/." "$CONTAINER_ID":/scripts/
      docker cp "${CONFIGS_DIR}/." "$CONTAINER_ID":/configs/
      docker cp "${ANSIBLE_DIR}/." "$CONTAINER_ID":/ansible/
      docker start -a "$CONTAINER_ID"
      EXIT_CODE=$(docker inspect "$CONTAINER_ID" --format='{{.State.ExitCode}}')
      echo "Container exit code: ${EXIT_CODE}"
      if [ "${EXIT_CODE}" -ne 0 ]; then
        echo "Error: Build container failed with exit code ${EXIT_CODE}"
        docker cp "$CONTAINER_ID":/output/. output/ || true
        docker rm "$CONTAINER_ID"
        exit 1
      fi
      echo "Extracting artifacts from container..."
      docker cp "$CONTAINER_ID":/output/. output/
      docker rm "$CONTAINER_ID" || true
    - echo "Build output:"
    - ls -la output/
    # Ensure artifacts were actually produced
    - '[ "$(ls -A output/*.img 2>/dev/null)" ] || (echo "Error: No image artifacts found in output/" && exit 1)'
    - chown -R "$(id -u):$(id -g)" output/ || true
  artifacts:
    when: always
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week

# Platform build — triggered by push to release/* branches, version tags, MRs, and develop (dev profile)
build:pimeleon:
  extends: .build-pimeleon
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.*)$/'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Custom build — manually triggered via Web/API with configurable variables
build:custom:
  extends: .docker-job
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - set -e
    - 'echo "Custom build for ${TARGET_PLATFORM} (Profile: ${PIMELEON_PROFILE})..."'
    - mkdir -p output cache
    - |
      # Compute mount paths - prioritize shared as baseline, allow branch-local overrides
      # if they contain the expected entry points.
      ANSIBLE_DIR="./shared/ansible"
      CONFIGS_DIR="./shared/configs"
      SCRIPTS_DIR="./shared/scripts"

      [ ! -f "./ansible/playbooks/main.yml" ] || ANSIBLE_DIR="./ansible"
      [ ! -d "./configs/network" ] || CONFIGS_DIR="./configs"
      [ ! -f "./scripts/build.sh" ] || SCRIPTS_DIR="./scripts"

      chmod +x "${SCRIPTS_DIR}/get-next-version.sh"
      BASE_VERSION=$("${SCRIPTS_DIR}/get-next-version.sh" "${TARGET_PLATFORM}")
      PIMELEON_VERSION="${BASE_VERSION}-${CI_COMMIT_SHORT_SHA}"
      echo "Building version: ${PIMELEON_VERSION}"
    - |
      CONTAINER_ID=$(docker create \
        --privileged \
        -v /dev:/dev:rw \
        -v "$CI_PROJECT_DIR/cache":/cache \
        -e CI=true \
        -e WORKSPACE_DIR=/workspace \
        -e CACHE_DIR=/cache \
        -e OUTPUT_DIR=/output \
        -e TARGET_PLATFORM="${TARGET_PLATFORM}" \
        -e PIMELEON_VERSION="${PIMELEON_VERSION}" \
        -e PIMELEON_PROFILE="${PIMELEON_PROFILE}" \
        -e APT_CACHE_SERVER="${APT_PROXY%:*}" \
        -e PIMELEON_UI_BUILD_TOKEN="${PIMELEON_UI_BUILD_TOKEN}" \
        "$BUILD_IMAGE")
      docker cp "${SCRIPTS_DIR}/." "$CONTAINER_ID":/scripts/
      docker cp "${CONFIGS_DIR}/." "$CONTAINER_ID":/configs/
      docker cp "${ANSIBLE_DIR}/." "$CONTAINER_ID":/ansible/
      docker start -a "$CONTAINER_ID"
      EXIT_CODE=$(docker inspect "$CONTAINER_ID" --format='{{.State.ExitCode}}')
      if [ "${EXIT_CODE}" -ne 0 ]; then
        docker cp "$CONTAINER_ID":/output/. output/ || true
        docker rm "$CONTAINER_ID"
        exit 1
      fi
      docker cp "$CONTAINER_ID":/output/. output/
      docker rm "$CONTAINER_ID" || true
    - ls -la output/
    - '[ "$(ls -A output/*.img 2>/dev/null)" ] || (echo "Error: No image artifacts found in output/" && exit 1)'
    - chown -R "$(id -u):$(id -g)" output/ || true
  artifacts:
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week
  allow_failure: true
