---
# GitLab CI/CD - Build
# Cache warming, Containers, and Pimeleon Image

# Detect platform from release branch name and export as dotenv artifact.
# Downstream jobs use TARGET_PLATFORM via: needs: [job: setup:platform, artifacts: true]
setup:platform:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
  script:
    - chmod +x .gitlab/scripts/detect-platform.sh
    - .gitlab/scripts/detect-platform.sh
  artifacts:
    reports:
      dotenv: platform.env

# Sync adblock2privoxy image and metadata between GitLab and GitHub.
# This ensures both registries have the latest pre-built Haskell binary.
sync:ab2p:
  stage: .pre
  image: docker:latest
  tags:
    - containers
  variables:
    DOCKER_HOST: ""
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
  script:
    - apk add --no-cache curl python3
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - chmod +x .gitlab/scripts/sync-ab2p.sh
    - .gitlab/scripts/sync-ab2p.sh

# Pull (or seed) the base image cache for the detected platform
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - chmod +x .gitlab/scripts/warm-cache.sh
    - .gitlab/scripts/warm-cache.sh

# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    # Rebuild if dependencies changed
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml

    - when: never
  script:
    - chmod +x .gitlab/scripts/build-containers.sh
    - .gitlab/scripts/build-containers.sh
# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
    - job: lint:yaml
      optional: true
    - job: lint:ansible
      optional: true
    - job: lint:shell
      optional: true
    - job: test:scripts
      optional: true
    - job: security:trivy
      optional: true
    - job: security:gitleaks
      optional: true
  tags:
    - heavy
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull
  script:
    - chmod +x .gitlab/scripts/build-image.sh .gitlab/scripts/resolve-version.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    when: always
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week

# Finalize build by uploading artifacts to registry if build passed
publish:image:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  environment:
    name: production
  needs:
    - job: setup:platform
      artifacts: true
    - job: build:pimeleon
      artifacts: true
    - job: test:smoke
      optional: true
    - job: test:integration
      optional: true
  rules:
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
  before_script:
    - apk add --no-cache curl git
  script:
    - chmod +x .gitlab/scripts/publish-image.sh
    - .gitlab/scripts/publish-image.sh
  artifacts:
    paths:
      - output/*.img.xz
      - output/*.sha256
    expire_in: 1 week

# Platform build — triggered by push to release/* branches, version tags, and release-bound MRs
build:pimeleon:
  extends: .build-pimeleon
  environment:
    name: $PIMELEON_ENV_NAME
  rules:
    # Tag — production build from GitHub releases
    - if: '$CI_COMMIT_TAG'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Push/merge to release/* — production build from GitHub releases
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
        BUILD_IMAGE_TAG: latest
        TEST_IMAGE_TAG: latest
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml
    # MR targeting release/* — only rebuild when image-relevant files changed
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
        BUILD_IMAGE_TAG: latest
        TEST_IMAGE_TAG: latest
      changes:
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/containers/**/*
        - shared/scripts/build.sh
        - shared/scripts/common.sh
        - shared/scripts/generate-privoxy-filters.sh
        - shared/scripts/lib-logging.sh
        - shared/scripts/lib-services.sh
        - shared/scripts/stage1-base.sh
        - shared/scripts/stage2-customize.sh
        - shared/scripts/stage3-optimize.sh
        - shared/scripts/stage4-package.sh
        - docker-compose.yml

    # Default: skip
    - when: never
