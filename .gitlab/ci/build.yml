---
# GitLab CI/CD - Build
# Cache warming, Containers, and Pimeleon Image

# Detect platform from release branch name and export as dotenv artifact.
# Downstream jobs use TARGET_PLATFORM via: needs: [job: setup:platform, artifacts: true]
setup:platform:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/detect-platform.sh
    - .gitlab/scripts/detect-platform.sh
  artifacts:
    reports:
      dotenv: platform.env

# Pull (or seed) the base image cache for the detected platform
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - mkdir -p cache
    - |
      CACHE_FILE="cache/pimeleon-${TARGET_PLATFORM}-base.tar.gz"
      if [ -f "$CACHE_FILE" ]; then
        echo "Cache found: $CACHE_FILE"
        ls -lh "$CACHE_FILE"
      else
        echo "Cache not found, will be created by build:pimeleon"
      fi

# Check whether the Pimeleon image for this version already exists in the registry
check:image:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache curl git
    - git fetch origin --tags 2>/dev/null || true
  script:
    - chmod +x .gitlab/scripts/check-image.sh
    - .gitlab/scripts/check-image.sh
  artifacts:
    reports:
      dotenv: image.env

# Check whether builder and tester images already exist in the registry
check:containers:
  extends: .docker-job
  stage: .pre
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - chmod +x .gitlab/scripts/check-containers.sh
    - .gitlab/scripts/check-containers.sh
  artifacts:
    reports:
      dotenv: containers.env

# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:containers
      artifacts: true
  rules:
    # Skip if containers already exist in registry
    - if: '$CONTAINERS_EXIST == "true"'
      when: never
    # Always allow manual trigger from web if they don't exist
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    # Trigger on tags or release branch changes (includes merged MRs)
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - when: never
  script:
    - chmod +x .gitlab/scripts/build-containers.sh
    - .gitlab/scripts/build-containers.sh

# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
  tags:
    - heavy
  cache:
    - key: "base-system-${TARGET_PLATFORM}"
      paths:
        - cache/
      policy: pull
    - key: "build-output-${CI_PIPELINE_ID}"
      paths:
        - output/
      policy: push
  script:
    - chmod +x .gitlab/scripts/build-image.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    paths:
      - output/*.log
      - output/*.txt
      - output/*.json
    expire_in: 1 week
    when: always

# Provide build output as artifacts (either upload from cache or download from registry)
.provide-artifacts:
  stage: build
  tags:
    - linux
  cache:
    key: "build-output-${CI_PIPELINE_ID}"
    paths:
      - output/
    policy: pull
  before_script:
    - apk add --no-cache curl jq
  script:
    - chmod +x .gitlab/scripts/provide-artifacts.sh
    - .gitlab/scripts/provide-artifacts.sh
  artifacts:
    paths:
      - output/
    expire_in: 1 week
  retry:
    max: 2
    when:
      - unknown_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure

# Platform build — triggered by push to release/* branches, version tags, MRs, and develop (dev profile)
build:pimeleon:
  extends: .build-pimeleon
  rules:
    # 1. ALWAYS build if version is NEW (not in registry)
    - if: '$IMAGE_EXISTS == "false"'
      when: on_success

    # 2. Build if version is OLD but SOURCES changed (fix on same version)
    - if: '$IMAGE_EXISTS == "true"'
      changes:
        - apps/**/*
        - shared/ansible/**/*
        - shared/configs/**/*
        - shared/scripts/**/*
        - scripts/**/*
        - Makefile
        - docker-compose.yml
        - requirements.txt
        - .env.defaults
      when: on_success

    # 3. SKIP build if version exists and NO sources changed (CI/Docs only)
    - if: '$IMAGE_EXISTS == "true"'
      when: never

    # Standard triggers for fallback
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'

provide:artifacts:
  extends: .provide-artifacts
  needs:
    - job: check:image
      artifacts: true
    - job: build:pimeleon
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'

# Custom build — manually triggered via Web/API with configurable variables
build:custom:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  cache:
    - key: "base-system-${TARGET_PLATFORM}"
      paths:
        - cache/
      policy: pull-push
    - key: "build-output-custom-${CI_PIPELINE_ID}"
      paths:
        - output/
      policy: push
  script:
    - chmod +x .gitlab/scripts/build-image.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    paths:
      - output/*.log
      - output/*.txt
      - output/*.json
    expire_in: 1 week
    when: always
  allow_failure: true

provide:custom-artifacts:
  extends: .provide-artifacts
  needs:
    - job: build:custom
  cache:
    key: "build-output-custom-${CI_PIPELINE_ID}"
    paths:
      - output/
    policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
