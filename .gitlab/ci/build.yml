---
# GitLab CI/CD - Build
# Cache warming, Containers, and Pimeleon Image

# Detect platform from release branch name and export as dotenv artifact.
# Downstream jobs use TARGET_PLATFORM via: needs: [job: setup:platform, artifacts: true]
setup:platform:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/detect-platform.sh
    - .gitlab/scripts/detect-platform.sh
  artifacts:
    reports:
      dotenv: platform.env

# Pull (or seed) the base image cache for the detected platform
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - chmod +x .gitlab/scripts/warm-cache.sh
    - .gitlab/scripts/warm-cache.sh

# Check whether the Pimeleon image for this version already exists in the registry
check:image:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(develop|release\/.+)$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/check-image.sh
    - .gitlab/scripts/check-image.sh
  artifacts:
    reports:
      dotenv: image.env

# Check whether builder and tester images already exist in the registry
check:containers:
  extends: .docker-job
  stage: .pre
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - chmod +x .gitlab/scripts/check-containers.sh
    - .gitlab/scripts/check-containers.sh
  artifacts:
    reports:
      dotenv: containers.env

# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:containers
      artifacts: true
  rules:
    # 1. Manual trigger always builds
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success

    # 2. Rebuild if image not found in registry (Bootstrap Case)
    - if: '$CONTAINERS_EXIST == "false" && $CI_COMMIT_TAG'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      when: on_success
    - if: '$CONTAINERS_EXIST == "false" && $CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      when: on_success
    - if: '$CONTAINERS_EXIST == "false" && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      when: on_success

    # 3. Rebuild if dependencies changed (Update Case)
    - if: '$CI_COMMIT_TAG'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml

    # 4. Reuse from registry if exists and metadata valid
    - when: never
  script:
    - chmod +x .gitlab/scripts/build-containers.sh
    - .gitlab/scripts/build-containers.sh
# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
    - job: lint:yaml
      optional: true
    - job: lint:ansible
      optional: true
    - job: lint:shell
      optional: true
    - job: test:scripts
      optional: true
    - job: security:trivy
      optional: true
    - job: security:gitleaks
      optional: true
  tags:
    - heavy
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull
  script:
    - chmod +x .gitlab/scripts/build-image.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    when: always
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week

# Finalize build by uploading artifacts to registry if build passed
publish:image:
  stage: publish
  image: alpine:latest
  tags:
    - lightweight
  environment:
    name: production
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:image
      artifacts: true
    - job: build:pimeleon
      artifacts: true
    - job: test:smoke
      optional: true
    - job: test:integration
      optional: true
  rules:
    # Production: tags
    - if: '$CI_COMMIT_TAG'
    # Production: MR to release/*
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    # Production: push/merge to release/*
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    # Production: manual trigger
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache curl
  script:
    - chmod +x .gitlab/scripts/publish-image.sh
    - .gitlab/scripts/publish-image.sh
  artifacts:
    paths:
      - output/*.img.xz
      - output/*.sha256
    expire_in: 1 week

# Platform build — triggered by push to release/* branches, version tags, MRs, and develop (dev profile)
build:pimeleon:
  extends: .build-pimeleon
  environment:
    name: $PIMELEON_ENV_NAME
  rules:
    # Skip if image already exists in registry (Smart Reuse)
    - if: '$IMAGE_EXISTS == "true"'
      when: never
    # Tag — production build from GitHub releases
    - if: '$CI_COMMIT_TAG'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Push/merge to release/* — production build from GitHub releases
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # MR to release/* — development build from GitLab registry
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
      variables:
        PIMELEON_ENV_NAME: development
        PIMELEON_APPS_SOURCE: gitlab
        BUILD_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
        TEST_IMAGE_TAG: ${CI_COMMIT_REF_SLUG}
    # Manual web trigger — production by default
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PIMELEON_ENV_NAME: production
        PIMELEON_APPS_SOURCE: github
      when: on_success

    # Default: skip
    - when: never
