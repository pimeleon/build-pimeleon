---
# GitLab CI/CD - Build
# Cache warming, Containers, and Pimeleon Image

# Detect platform from release branch name and export as dotenv artifact.
# Downstream jobs use TARGET_PLATFORM via: needs: [job: setup:platform, artifacts: true]
setup:platform:
  stage: .pre
  image: alpine:latest
  tags:
    - lightweight
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - chmod +x .gitlab/scripts/detect-platform.sh
    - .gitlab/scripts/detect-platform.sh
  artifacts:
    reports:
      dotenv: platform.env

# Pull (or seed) the base image cache for the detected platform
warm-cache:
  stage: .pre
  image: alpine:latest
  tags:
    - linux
  needs:
    - job: setup:platform
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - mkdir -p cache
    - |
      CACHE_FILE="cache/pimeleon-${TARGET_PLATFORM}-base.tar.gz"
      if [ -f "$CACHE_FILE" ]; then
        echo "Cache found: $CACHE_FILE"
        ls -lh "$CACHE_FILE"
      else
        echo "Cache not found, will be created by build:pimeleon"
      fi

# Check whether builder and tester images already exist in the registry
check:containers:
  extends: .docker-job
  stage: .pre
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never
  script:
    - |
      if docker manifest inspect "${CI_REGISTRY_IMAGE}/builder:latest" >/dev/null 2>&1 && \
         docker manifest inspect "${CI_REGISTRY_IMAGE}/tester:latest" >/dev/null 2>&1; then
        echo "CONTAINERS_EXIST=true" >> containers.env
        echo "Builder and tester images already in registry — build will be skipped"
      else
        echo "CONTAINERS_EXIST=false" >> containers.env
        echo "Images not found in registry — build required"
      fi
  artifacts:
    reports:
      dotenv: containers.env

# Build builder and tester Docker images when container sources change
build:containers:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: check:containers
      artifacts: true
  rules:
    # Skip if containers already exist in registry
    - if: '$CONTAINERS_EXIST == "true"'
      when: never
    # Always allow manual trigger from web if they don't exist
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_success
    # Trigger on tags or release branch changes (includes merged MRs)
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
      changes:
        - shared/containers/**/*
        - containers/**/*
        - apps/**/*
        - docker-compose.yml
    - when: never
  script:
    - chmod +x .gitlab/scripts/build-containers.sh
    - .gitlab/scripts/build-containers.sh

# Hidden template — shared build logic for all platform jobs
.build-pimeleon:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
  tags:
    - heavy
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull
  script:
    - chmod +x .gitlab/scripts/build-image.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week

# Platform build — triggered by push to release/* branches, version tags, MRs, and develop (dev profile)
build:pimeleon:
  extends: .build-pimeleon
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\//'

# Custom build — manually triggered via Web/API with configurable variables
build:custom:
  extends: .docker-job
  stage: build
  needs:
    - job: setup:platform
      artifacts: true
    - job: warm-cache
    - job: build:containers
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  cache:
    key: "base-system-${TARGET_PLATFORM}"
    paths:
      - cache/
    policy: pull-push
  script:
    - chmod +x .gitlab/scripts/build-image.sh
    - .gitlab/scripts/build-image.sh
  after_script:
    - chmod +x .gitlab/scripts/cleanup-build-container.sh
    - .gitlab/scripts/cleanup-build-container.sh
  artifacts:
    paths:
      - output/*.img.xz
      - output/*.img.metadata.json
      - output/*.img.sha256
      - output/*.img.md5
      - output/*.img.xz.sha256
      - output/*.img.xz.md5
      - output/*.packages.txt
      - output/*.version.txt
      - output/*.log
      - output/pim-initial-password.txt
    expire_in: 1 week
  allow_failure: true
